<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>5 Questions Q&A Studio Ultimate</title>
    <!-- GOOGLE FONTS FOR HINDI & ENGLISH -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@600;700;800&family=Kalam:wght@700&family=Poppins:wght@600;700;800;900&family=Rozha+One&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #060b18; 
            font-family: 'Hind', sans-serif; 
            color: #ffffff;
        }

        /* ================= 1. CREATOR / SETUP SCREEN ================= */
        #creator-screen {
            width: 100%;
            height: 100%;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0f172a;
            overflow-y: auto;
            font-family: 'Poppins', sans-serif;
        }
        .main-app-title {
            text-align: center;
            color: #38bdf8;
            font-size: 20px;
            font-weight: 800;
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
        }

        /* BACKUP & RESTORE BOX */
        .backup-card {
            border: 1px dashed #059669;
            background: #064e3b15;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .backup-title {
            font-size: 13px;
            font-weight: 700;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-row { display: flex; gap: 10px; }
        .btn-backup {
            flex: 1;
            background: #059669;
            color: white;
            border: none;
            padding: 9px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-restore {
            flex: 1;
            background: #d97706;
            color: white;
            border: none;
            padding: 9px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        /* INPUT SETTINGS CARD */
        .card {
            background: #1e293b;
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .card label {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
        }
        .input-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .input-row input, .input-row select {
            flex: 1;
            min-width: 140px;
            padding: 8px 10px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #f8fafc;
            font-size: 13px;
            font-weight: bold;
            outline: none;
        }
        
        textarea {
            width: 100%;
            height: 140px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 10px;
            color: #f8fafc;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.5;
            font-family: 'Hind', sans-serif;
            font-weight: 600;
        }
        .btn-save-box {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 4px;
            transition: background 0.2s;
        }
        .btn-save-box:active { background: #059669; }

        .btn-play-launch {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
            margin-top: 2px;
        }

        /* FX CONTROLS IN HOME SCREEN */
        .home-fx-box {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .home-fx-box select {
            flex: 1;
            padding: 8px 10px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #38bdf8;
            font-size: 13px;
            font-weight: bold;
            outline: none;
        }
        .home-fx-btn {
            background: #8b5cf6;
            color: white;
            font-weight: 800;
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
        }
        .home-fx-btn.fx-active {
            background: #06b6d4 !important;
            box-shadow: 0 0 10px #06b6d4 !important;
        }

        /* MANAGE QUESTIONS LIST STYLES */
        .manage-list-box {
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }
        .manage-item-row {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .manage-item-text {
            flex: 1;
            font-size: 13px;
            line-height: 1.4;
            font-family: 'Hind', sans-serif;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .manage-item-text .q-prev {
            font-weight: 700;
            color: #e2e8f0;
        }
        .manage-item-text .a-prev {
            color: #10b981;
            font-weight: 600;
        }
        .manage-item-actions {
            display: flex;
            gap: 6px;
        }
        .btn-mng {
            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }
        .btn-mng-edit { background: #0284c7; color: white; }
        .btn-mng-del { background: #ef4444; color: white; }

        /* ================= 2. PLAY SCREEN ================= */
        #play-screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            background: #060b18;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* LIKE & SHARE FLOATING BANNER */
        #like-banner {
            display: none;
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.95), rgba(219, 39, 119, 0.95));
            color: #ffffff;
            padding: 16px 28px;
            border-radius: 40px;
            font-size: 20px;
            font-weight: 900;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.8), 0 4px 15px rgba(0,0,0,0.5);
            border: 2px solid #ffffff;
            z-index: 200;
            pointer-events: none;
            text-align: center;
            letter-spacing: 0.5px;
            font-family: 'Poppins', sans-serif;
            white-space: nowrap;
        }
        @keyframes bannerPopAnim {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        .show-banner {
            display: block !important;
            animation: bannerPopAnim 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* CONTINUOUS BLINK HEADER */
        @keyframes headerContinuousBlink {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
                box-shadow: 0 0 18px rgba(0, 242, 254, 0.6), inset 0 0 10px rgba(0, 242, 254, 0.2);
            }
            50% {
                opacity: 0.72;
                transform: scale(0.985);
                box-shadow: 0 0 6px rgba(0, 242, 254, 0.2), inset 0 0 4px rgba(0, 242, 254, 0.1);
            }
        }

        /* THEMES STYLING */
        #play-screen.theme-dark {
            background: #050a16;
            color: #ffffff;
        }
        #play-screen.theme-dark .play-neon-header {
            border: 3px solid #00f2fe;
            animation: headerContinuousBlink 1.8s ease-in-out infinite;
        }
        #play-screen.theme-dark .neon-subtitle { color: #00f2fe; }
        #play-screen.theme-dark .q-card-item { 
            background: rgba(13, 27, 54, 0.75); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        #play-screen.theme-dark .q-card-item.active-highlight { 
            border: 1.5px solid #00d2ff; 
            background: rgba(16, 42, 82, 0.85); 
            box-shadow: 0 0 16px rgba(0, 210, 255, 0.35); 
        }

        #play-screen.theme-purple {
            background: linear-gradient(135deg, #0f0728, #1e0842);
            color: #ffffff;
        }
        #play-screen.theme-purple .play-neon-header { border: 3px solid #f59e0b; }
        #play-screen.theme-purple .q-card-item { background: rgba(30, 8, 66, 0.7); border: 1px solid #4c1d95; }
        #play-screen.theme-purple .q-card-item.active-highlight { border: 1.5px solid #f59e0b; background: rgba(88, 28, 135, 0.6); }

        #play-screen.theme-light {
            background: #f1f5f9;
            color: #0f172a;
        }
        #play-screen.theme-light .play-neon-header { border: 3px solid #0284c7; }
        #play-screen.theme-light .q-text-string { color: #0f172a; }
        #play-screen.theme-light .q-card-item { background: #ffffff; border: 1px solid #cbd5e1; }
        #play-screen.theme-light .q-card-item.active-highlight { border: 1.5px solid #0284c7; background: #e0f2fe; }

        /* HIGH CONTRAST CLEAR YELLOW THEME */
        #play-screen.theme-yellow {
            background: #facc15;
            color: #000000;
        }
        #play-screen.theme-yellow .play-neon-header {
            border: 3px solid #92400e;
            background: #fef08a;
            box-shadow: 0 0 12px rgba(146, 64, 14, 0.35);
        }
        #play-screen.theme-yellow .neon-title { color: #78350f !important; font-weight: 900; }
        #play-screen.theme-yellow .neon-subtitle { color: #92400e !important; font-weight: 800; }
        #play-screen.theme-yellow .q-card-item { 
            background: #ffffff !important; 
            border: 2px solid #ca8a04 !important; 
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12) !important;
        }
        #play-screen.theme-yellow .q-card-item.active-highlight { 
            border: 2.5px solid #b45309 !important; 
            background: #fffbeb !important; 
            box-shadow: 0 0 14px rgba(180, 83, 9, 0.45) !important;
        }
        #play-screen.theme-yellow .q-badge-num { 
            background: #92400e !important; 
            color: #ffffff !important; 
        }
        #play-screen.theme-yellow .q-text-string { 
            color: #111827 !important; 
            font-weight: 800 !important;
        }
        #play-screen.theme-yellow .ans-revealed-box {
            color: #ffffff !important;
            background: #991b1b !important;
            border-left: 5px solid #450a0a !important;
            box-shadow: 0 4px 12px rgba(153, 27, 27, 0.4) !important;
            font-weight: 800 !important;
            opacity: 1 !important;
        }

        /* NEON GLOW HEADER */
        .play-header-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px 15px 4px 15px;
            width: 100%;
            z-index: 5;
            flex-shrink: 0;
        }
        .play-neon-header {
            text-align: center;
            background: transparent;
            border-radius: 18px;
            padding: 4px 20px;
            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 94%;
        }
        .neon-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }
        .neon-subtitle {
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: 0.8px;
            margin-top: 1px;
        }

        /* 5-QUESTIONS CONTAINER */
        .q-viewport {
            flex: 1;
            padding: 4px 42px 160px 42px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            gap: 8px;
            overflow: hidden;
            z-index: 5;
        }

        /* Q-CARD ITEM */
        .q-card-item {
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: all 0.35s ease;
            position: relative;
        }
        .q-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* NUMBER BADGE */
        .q-badge-num {
            background: #0084ff;
            color: #ffffff;
            font-size: 12px;
            font-weight: 900;
            padding: 3px 7px;
            border-radius: 5px;
            min-width: 24px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 2px 6px rgba(0, 132, 255, 0.4);
            flex-shrink: 0;
        }

        /* QUESTION TEXT - FIXED TO 15px */
        .q-text-string {
            font-size: 15px !important;
            font-weight: 800;
            line-height: 1.35;
            color: #ffffff;
            letter-spacing: 0.2px;
        }

        /* SLOW & GENTLE ANSWER POP IN ANIMATION */
        @keyframes answerPopInSlow {
            0% { opacity: 0; transform: translateY(-10px) scale(0.97); }
            60% { opacity: 0.85; transform: translateY(1px) scale(1.01); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .ans-revealed-box {
            display: none;
            margin-left: 34px;
            font-size: 14px !important;
            font-weight: 800;
            color: #2ed573;
            background: rgba(46, 213, 115, 0.14);
            border-left: 4px solid #2ed573;
            padding: 4px 10px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(46, 213, 115, 0.25);
            animation: answerPopInSlow 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* BLINK ATTENTION ANIMATION */
        @keyframes attentionBlinkAnim {
            0%, 100% { opacity: 1; transform: scale(1); filter: brightness(1); }
            50% { opacity: 0.35; transform: scale(0.98); filter: brightness(1.6); box-shadow: 0 0 18px #00f2fe; }
        }
        .blink-attention { animation: attentionBlinkAnim 0.35s ease-in-out 3; }

        /* FOREGROUND TRANSITION LAYER */
        #fx-overlay-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            overflow: hidden;
            display: none;
        }

        .fx-water-bubble {
            position: absolute;
            bottom: -60px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(56, 189, 248, 0.45) 45%, rgba(14, 165, 233, 0.25) 70%, rgba(255, 255, 255, 0.1) 100%);
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.8), inset -2px -2px 6px rgba(2, 132, 199, 0.4), 0 0 12px rgba(56, 189, 248, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.7);
            animation: waterFloatUp linear infinite;
        }
        @keyframes waterFloatUp {
            0% { transform: translateY(0) translateX(0) scale(0.85); opacity: 0; }
            12% { opacity: 0.85; }
            50% { transform: translateY(-55vh) translateX(15px) scale(1.02); }
            85% { opacity: 0.75; }
            100% { transform: translateY(-115vh) translateX(-15px) scale(1.15); opacity: 0; }
        }

        .fx-glass-bubble {
            position: absolute;
            bottom: -50px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.15) 60%, rgba(255, 255, 255, 0.05) 100%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.5), 0 0 10px rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(1.5px);
            animation: glassFloatUp linear infinite;
        }
        @keyframes glassFloatUp {
            0% { transform: translateY(0) translateX(0) scale(0.8); opacity: 0; }
            15% { opacity: 0.75; }
            85% { opacity: 0.65; }
            100% { transform: translateY(-110vh) translateX(20px) scale(1.1); opacity: 0; }
        }

        .fx-golden-star {
            position: absolute;
            bottom: -30px;
            font-size: 22px;
            color: #facc15;
            text-shadow: 0 0 10px #f59e0b, 0 0 20px #eab308;
            animation: starFloatUp linear infinite;
        }
        @keyframes starFloatUp {
            0% { transform: translateY(0) rotate(0deg) scale(0.6); opacity: 0; }
            15% { opacity: 0.95; }
            50% { transform: translateY(-50vh) rotate(180deg) scale(1.1); }
            85% { opacity: 0.75; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(0.8); opacity: 0; }
        }

        .fx-rose-petal {
            position: absolute;
            top: -40px;
            width: 18px;
            height: 24px;
            background: linear-gradient(135deg, #fb7185, #e11d48);
            border-radius: 50% 0 50% 50%;
            box-shadow: 0 2px 6px rgba(225, 29, 72, 0.4);
            opacity: 0.85;
            animation: petalFallDown linear infinite;
        }
        @keyframes petalFallDown {
            0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0; }
            15% { opacity: 0.85; }
            50% { transform: translateY(50vh) rotate(160deg) translateX(20px); }
            100% { transform: translateY(115vh) rotate(340deg) translateX(-20px); opacity: 0; }
        }

        .fx-confetti-piece {
            position: absolute;
            top: -20px;
            width: 9px;
            height: 15px;
            border-radius: 3px;
            animation: confettiFall linear infinite;
        }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
            100% { transform: translateY(115vh) rotate(720deg) translateX(25px); opacity: 0.25; }
        }

        .fx-firefly-orb {
            position: absolute;
            bottom: -30px;
            border-radius: 50%;
            background: #a3e635;
            box-shadow: 0 0 14px #bef264, 0 0 25px #84cc16;
            animation: fireflyFloat linear infinite;
        }
        @keyframes fireflyFloat {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            20% { opacity: 0.95; }
            50% { transform: translateY(-50vh) translateX(30px) scale(1.15); }
            80% { opacity: 0.85; }
            100% { transform: translateY(-115vh) translateX(-30px) scale(0.75); opacity: 0; }
        }

        /* ================= WIDER BOTTOM BAR & BALANCED BUTTONS ================= */
        .bottom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 14px; /* Widened/thickened bottom bar */
            background: rgba(10, 15, 29, 0.98);
            border-top: 1px solid rgba(255, 255, 255, 0.14);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            font-family: 'Poppins', sans-serif;
            z-index: 100;
            flex-wrap: nowrap;
            white-space: nowrap;
        }
        .btn-ctrl {
            padding: 9px 12px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.1s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-ctrl:active { transform: scale(0.92); }
        
        .btn-ctrl-home { 
            background: #dc2626; 
            color: white; 
            padding: 9px 12px;
            font-size: 14px;
        }
        .btn-ctrl-like {
            background: linear-gradient(135deg, #ec4899, #f43f5e);
            color: white;
            padding: 9px 12px;
            font-size: 14px;
            box-shadow: 0 2px 6px rgba(236, 72, 153, 0.35);
        }
        .btn-ctrl-prev { background: #475569; color: white; }
        .btn-ctrl-blink { 
            background: #eab308; 
            color: #000; 
            font-weight: 800;
        }

        /* SHRUNK / COMPACT NEXT BUTTON */
        .btn-ctrl-next { 
            background: #0084ff; 
            color: white; 
            font-size: 13px; 
            font-weight: 800;
            padding: 8px 16px; /* Controlled, compact width */
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 132, 255, 0.4); 
        }

        /* GO TO JUMP CONTROLS */
        .jump-container {
            display: flex;
            align-items: center;
            gap: 3px;
            background: #1e293b;
            padding: 3px 6px;
            border-radius: 6px;
            border: 1px solid #334155;
            flex-shrink: 0;
        }
        .jump-inp {
            width: 36px;
            padding: 6px 2px;
            border-radius: 4px;
            border: 1px solid #0084ff;
            background: #0f172a;
            color: #38bdf8;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            outline: none;
        }
        .btn-jump-trigger {
            background: #0084ff;
            color: white;
            border: none;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 1. CREATOR & STORAGE SCREEN -->
    <div id="creator-screen">
        <div class="main-app-title">5 Questions Q&A Studio Pro</div>

        <!-- BACKUP / RESTORE SECTION -->
        <div class="backup-card">
            <div class="backup-title">💾 DATA BACKUP & RESTORE STUDIO</div>
            <div class="btn-row">
                <button class="btn-backup" onclick="exportBackupData()">💾 Export / Save Backup</button>
                <button class="btn-restore" onclick="document.getElementById('import-file-input').click()">📤 Import / Restore Backup</button>
                <input type="file" id="import-file-input" accept=".json" style="display:none;" onchange="importBackupData(this)">
            </div>
        </div>

        <!-- THEME & FONT SELECTOR -->
        <div class="card">
            <label>थीम एवं हिंदी फॉन्ट स्टाइल:</label>
            <div class="input-row">
                <select id="cfg-theme" onchange="autoSaveToStorage()">
                    <option value="theme-dark" selected>Pro Dark Theme (Blue Accent)</option>
                    <option value="theme-yellow">Bright Yellow Theme (Clear High-Contrast)</option>
                    <option value="theme-purple">Royal Purple Gold (हाई एंगेजमेंट)</option>
                    <option value="theme-light">Classic Light (White Clean)</option>
                </select>
                <select id="cfg-font" onchange="autoSaveToStorage()">
                    <option value="'Hind', sans-serif" selected>Hind (साफ बोल्ड देवनागरी फॉन्ट)</option>
                    <option value="'Rozha One', serif">Rozha One (बोल्ड आकर्षक फॉन्ट)</option>
                    <option value="'Kalam', cursive">Kalam (कलाम - लिखावट)</option>
                    <option value="'Poppins', sans-serif">Poppins (मॉडर्न फॉन्ट)</option>
                </select>
            </div>
        </div>

        <!-- TITLE SETTINGS -->
        <div class="card">
            <label>शीर्षक एवं विषय (Title & Subject):</label>
            <div class="input-row">
                <input type="text" id="cfg-title" value="Mission 2026" placeholder="Main Title" oninput="autoSaveToStorage()">
                <input type="text" id="cfg-subtitle" value="amazing Questions" placeholder="Subtitle (Part खुद जुड़ेगा)" oninput="autoSaveToStorage()">
            </div>
        </div>

        <!-- FX EFFECT CONTROLS -->
        <div class="card">
            <label>एनीमेशन प्रभाव (FX Overlay Effect):</label>
            <div class="home-fx-box">
                <select id="fx-type-select" onchange="onFxSelectChange(); autoSaveToStorage();">
                    <option value="water" selected>💧 Water Bubble</option>
                    <option value="glass">🫧 Glass Bubble</option>
                    <option value="star">✨ Golden Star</option>
                    <option value="rose">🌸 Rose Petal</option>
                    <option value="confetti">🎆 Confetti</option>
                    <option value="firefly">💡 Firefly Glow</option>
                </select>
                <button class="home-fx-btn" id="btn-fx-trigger" onclick="toggleOverlayEffects()">FX: OFF</button>
            </div>
        </div>

        <!-- QUESTION & ANSWER PAIR INPUT -->
        <div class="card">
            <label>प्रश्न और उत्तर पेस्ट करें (पहले प्रश्न, ठीक नीचे उसका उत्तर):</label>
            <textarea id="cfg-raw-data" placeholder="यहाँ नए प्रश्न और उत्तर पेस्ट करें..."></textarea>
            <button class="btn-save-box" onclick="saveNewQuestionsFromBox()">💾 Save Questions / प्रश्न जोड़ें</button>
        </div>

        <!-- MANAGE SAVED QUESTIONS (VIEW, EDIT, DELETE) -->
        <div class="card">
            <label>सहेजे गए प्रश्न देखें, एडिट या डिलीट करें (Manage Saved Questions):</label>
            <div class="manage-list-box" id="saved-questions-list">
                <!-- Rendered Dynamically -->
            </div>
        </div>

        <button class="btn-play-launch" onclick="launchPlayScreen()">Play Multi-View Q&A 🚀</button>
    </div>

    <!-- 2. PLAY SCREEN -->
    <div id="play-screen" class="theme-dark">
        <!-- LIKE & SHARE FLOATING BANNER -->
        <div id="like-banner">👍 Like & Share 🔔</div>

        <!-- FOREGROUND ANIMATED TRANSITION EFFECT -->
        <div id="fx-overlay-layer"></div>

        <!-- NEON CONTINUOUS BLINK HEADER -->
        <div class="play-header-container">
            <div class="play-neon-header">
                <div class="neon-title" id="out-title">Mission 2026</div>
                <div class="neon-subtitle" id="out-subtitle">amazing Questions | Part 1</div>
            </div>
        </div>

        <!-- 5 QUESTIONS VIEWPORT -->
        <div class="q-viewport" id="questions-holder">
            <!-- 5 Questions load dynamically -->
        </div>

        <!-- WIDER BOTTOM CONTROL BAR -->
        <div class="bottom-controls">
            <button class="btn-ctrl btn-ctrl-home" onclick="returnToCreator()" title="Home">🏠</button>
            <button class="btn-ctrl btn-ctrl-like" onclick="triggerLikeBanner()" title="Like & Share">👍</button>
            <button class="btn-ctrl btn-ctrl-prev" onclick="handlePrevAction()">⬅️</button>
            <button class="btn-ctrl btn-ctrl-blink" onclick="triggerAllQuestionsBlink()">⚡</button>
            
            <button class="btn-ctrl btn-ctrl-next" id="main-next-btn" onclick="handleNextAction()">Next</button>
            
            <!-- GO TO QUESTION FEATURE -->
            <div class="jump-container">
                <input type="number" id="jump-box" placeholder="#" min="1" class="jump-inp">
                <button class="btn-jump-trigger" onclick="handleJumpGo()">Go</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "QA_STUDIO_PERSISTENT_STORE_V5";
        let qaList = [];
        let currentBatchIndex = 0;
        let answerRevealIndex = 0;
        let isOverlayFxActive = false;
        let fxSpawnTimer = null;
        let bannerTimer = null;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playChimeSound() {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.18);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.22);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.22);
            } catch(e) {}
        }

        function triggerLikeBanner() {
            const banner = document.getElementById('like-banner');
            banner.classList.remove('show-banner');
            void banner.offsetWidth;
            banner.classList.add('show-banner');
            
            clearTimeout(bannerTimer);
            bannerTimer = setTimeout(() => {
                banner.classList.remove('show-banner');
            }, 2500);
        }

        function autoSaveToStorage() {
            const data = {
                title: document.getElementById('cfg-title').value,
                subtitle: document.getElementById('cfg-subtitle').value,
                theme: document.getElementById('cfg-theme').value,
                font: document.getElementById('cfg-font').value,
                fxType: document.getElementById('fx-type-select').value,
                fxActive: isOverlayFxActive,
                savedQaList: qaList
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function autoLoadFromStorage() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if(stored) {
                try {
                    const parsed = JSON.parse(stored);
                    if(parsed.title !== undefined) document.getElementById('cfg-title').value = parsed.title;
                    if(parsed.subtitle !== undefined) document.getElementById('cfg-subtitle').value = parsed.subtitle;
                    if(parsed.theme) document.getElementById('cfg-theme').value = parsed.theme;
                    if(parsed.font) document.getElementById('cfg-font').value = parsed.font;
                    if(parsed.fxType) document.getElementById('fx-type-select').value = parsed.fxType;
                    if(parsed.fxActive) {
                        toggleOverlayEffects(true);
                    }
                    if(parsed.savedQaList && Array.isArray(parsed.savedQaList)) {
                        qaList = parsed.savedQaList;
                    } else if(parsed.rawData) {
                        const lines = parsed.rawData.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                        qaList = [];
                        for(let i = 0; i < lines.length; i += 2) {
                            let q = lines[i];
                            let a = lines[i+1] || "उत्तर उपलब्ध नहीं है";
                            qaList.push({ q, a });
                        }
                    }
                } catch(e){}
            }

            if(qaList.length === 0) {
                qaList = [
                    { q: "सिंधु घाटी सभ्यता का प्रमुख बंदरगाह कौन-सा था?", a: "लोथल" },
                    { q: "पानीपत की तीसरी लड़ाई किस वर्ष लड़ी गई थी?", a: "1761" },
                    { q: "भारत में सबसे बड़ी मीठे पानी की झील कौन-सी है?", a: "वूलर झील" },
                    { q: "भारत का सबसे ऊँचा जलप्रपात किस राज्य में स्थित है?", a: "कर्नाटक" },
                    { q: "भारतीय संविधान में मौलिक कर्तव्य किस देश के संविधान से लिए गए हैं?", a: "रूस (तत्कालीन सोवियत संघ)" }
                ];
            }

            renderManageList();
        }

        function saveNewQuestionsFromBox() {
            const text = document.getElementById('cfg-raw-data').value.trim();
            if(!text) {
                alert("कृपया पहले बॉक्स में प्रश्न और उत्तर पेस्ट करें!");
                return;
            }

            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            let addedCount = 0;
            for(let i = 0; i < lines.length; i += 2) {
                let q = lines[i];
                let a = lines[i+1] || "उत्तर उपलब्ध नहीं है";
                qaList.push({ q, a });
                addedCount++;
            }

            document.getElementById('cfg-raw-data').value = "";
            autoSaveToStorage();
            renderManageList();
            alert(`✅ ${addedCount} प्रश्न सफलतापूर्वक सेव हो गए हैं!`);
        }

        function exportBackupData() {
            autoSaveToStorage();
            const data = {
                title: document.getElementById('cfg-title').value,
                subtitle: document.getElementById('cfg-subtitle').value,
                theme: document.getElementById('cfg-theme').value,
                font: document.getElementById('cfg-font').value,
                fxType: document.getElementById('fx-type-select').value,
                savedQaList: qaList,
                date: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `QA_Backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            a.remove();
        }

        function importBackupData(input) {
            if(input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if(parsed.title !== undefined) document.getElementById('cfg-title').value = parsed.title;
                        if(parsed.subtitle !== undefined) document.getElementById('cfg-subtitle').value = parsed.subtitle;
                        if(parsed.theme) document.getElementById('cfg-theme').value = parsed.theme;
                        if(parsed.font) document.getElementById('cfg-font').value = parsed.font;
                        if(parsed.fxType) document.getElementById('fx-type-select').value = parsed.fxType;
                        if(parsed.savedQaList && Array.isArray(parsed.savedQaList)) {
                            qaList = parsed.savedQaList;
                        }
                        autoSaveToStorage();
                        renderManageList();
                        alert("✅ बैकअप सफलतापूर्वक लोड हो गया है!");
                    } catch(err) {
                        alert("❌ अमान्य बैकअप फ़ाइल!");
                    }
                };
                reader.readAsText(input.files[0]);
            }
        }

        function renderManageList() {
            const listContainer = document.getElementById('saved-questions-list');
            if(!listContainer) return;

            if(qaList.length === 0) {
                listContainer.innerHTML = `<div style="text-align:center; color:#64748b; font-size:12px; padding:10px;">कोई प्रश्न उपलब्ध नहीं है। ऊपर बॉक्स में पेस्ट करके सेव करें।</div>`;
                return;
            }

            let html = "";
            qaList.forEach((item, idx) => {
                html += `
                    <div class="manage-item-row">
                        <div class="manage-item-text">
                            <span class="q-prev">#${idx + 1}. ${escapeHtml(item.q)}</span><br>
                            <span class="a-prev">उत्तर: ${escapeHtml(item.a)}</span>
                        </div>
                        <div class="manage-item-actions">
                            <button class="btn-mng btn-mng-edit" onclick="editQuestionItem(${idx})">✏️ Edit</button>
                            <button class="btn-mng btn-mng-del" onclick="deleteQuestionItem(${idx})">🗑️ Delete</button>
                        </div>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function editQuestionItem(index) {
            const currentItem = qaList[index];
            const newQ = prompt("प्रश्न एडिट करें:", currentItem.q);
            if(newQ === null) return;
            const newA = prompt("उत्तर एडिट करें:", currentItem.a);
            if(newA === null) return;

            if(newQ.trim()) qaList[index].q = newQ.trim();
            if(newA.trim()) qaList[index].a = newA.trim();

            autoSaveToStorage();
            renderManageList();
        }

        function deleteQuestionItem(index) {
            if(confirm(`क्या आप प्रश्न #${index + 1} को हटाना चाहते हैं?`)) {
                qaList.splice(index, 1);
                autoSaveToStorage();
                renderManageList();
            }
        }

        function launchPlayScreen() {
            if(qaList.length === 0) {
                alert("कृपया पहले प्रश्न जोड़ें!");
                return;
            }

            const playScreen = document.getElementById('play-screen');
            const chosenTheme = document.getElementById('cfg-theme').value;
            playScreen.className = chosenTheme;

            const chosenFont = document.getElementById('cfg-font').value;
            playScreen.style.fontFamily = chosenFont;

            document.getElementById('out-title').innerText = document.getElementById('cfg-title').value || "Mission 2026";

            currentBatchIndex = 0;
            document.getElementById('creator-screen').style.display = 'none';
            document.getElementById('play-screen').style.display = 'flex';
            
            if(isOverlayFxActive) {
                document.getElementById('fx-overlay-layer').style.display = 'block';
                startOverlayFxLoop();
            }

            renderBatch(0);
        }

        function renderBatch(batchIdx) {
            currentBatchIndex = batchIdx;
            answerRevealIndex = 0;

            const partNum = currentBatchIndex + 1;
            const customSub = document.getElementById('cfg-subtitle').value.trim();
            if(customSub) {
                document.getElementById('out-subtitle').innerText = `${customSub} | Part ${partNum}`;
            } else {
                document.getElementById('out-subtitle').innerText = `Part ${partNum}`;
            }

            const holder = document.getElementById('questions-holder');
            holder.innerHTML = "";

            const start = currentBatchIndex * 5;
            const currentBatch = qaList.slice(start, start + 5);

            currentBatch.forEach((item, idx) => {
                const qNum = start + idx + 1;
                holder.innerHTML += `
                    <div class="q-card-item" id="item-${idx}">
                        <div class="q-title-row">
                            <div class="q-badge-num">${qNum}</div>
                            <div class="q-text-string">${item.q}</div>
                        </div>
                        <div class="ans-revealed-box" id="ans-${idx}">
                            उत्तर: ${item.a}
                        </div>
                    </div>
                `;
            });

            updateControlBtn();
        }

        function handleNextAction() {
            const start = currentBatchIndex * 5;
            const itemsInBatch = Math.min(5, qaList.length - start);

            if(answerRevealIndex < itemsInBatch) {
                if(answerRevealIndex > 0) {
                    const prev = document.getElementById(`item-${answerRevealIndex - 1}`);
                    if(prev) prev.classList.remove('active-highlight');
                }

                const curCard = document.getElementById(`item-${answerRevealIndex}`);
                const curAns = document.getElementById(`ans-${answerRevealIndex}`);
                if(curCard) curCard.classList.add('active-highlight');
                if(curAns) {
                    curAns.style.display = "block";
                    playChimeSound();
                }

                answerRevealIndex++;
                updateControlBtn();
            } else {
                const totalBatches = Math.ceil(qaList.length / 5);
                if(currentBatchIndex + 1 < totalBatches) {
                    renderBatch(currentBatchIndex + 1);
                } else {
                    alert("🎉 सभी प्रश्न पूरे हो चुके हैं!");
                    returnToCreator();
                }
            }
        }

        function handlePrevAction() {
            if(answerRevealIndex > 0) {
                answerRevealIndex--;
                const curCard = document.getElementById(`item-${answerRevealIndex}`);
                const curAns = document.getElementById(`ans-${answerRevealIndex}`);
                if(curCard) curCard.classList.remove('active-highlight');
                if(curAns) curAns.style.display = "none";
                
                if(answerRevealIndex > 0) {
                    const prevCard = document.getElementById(`item-${answerRevealIndex - 1}`);
                    if(prevCard) prevCard.classList.add('active-highlight');
                }
                updateControlBtn();
            } else if(currentBatchIndex > 0) {
                renderBatch(currentBatchIndex - 1);
            }
        }

        function triggerAllQuestionsBlink() {
            const start = currentBatchIndex * 5;
            const itemsInBatch = Math.min(5, qaList.length - start);

            const unrevealedCards = [];
            for(let i = answerRevealIndex; i < itemsInBatch; i++) {
                const card = document.getElementById(`item-${i}`);
                if(card) {
                    unrevealedCards.push(card);
                    card.classList.remove('blink-attention');
                    void card.offsetWidth;
                    card.classList.add('blink-attention');
                }
            }

            if(unrevealedCards.length > 0) {
                setTimeout(() => {
                    unrevealedCards.forEach(card => card.classList.remove('blink-attention'));
                }, 1100);
            }
        }

        function toggleOverlayEffects(forceVal) {
            const layer = document.getElementById('fx-overlay-layer');
            const btn = document.getElementById('btn-fx-trigger');
            
            if(forceVal !== undefined) {
                isOverlayFxActive = forceVal;
            } else {
                isOverlayFxActive = !isOverlayFxActive;
            }

            if(isOverlayFxActive) {
                btn.classList.add('fx-active');
                btn.innerText = "FX: ON";
                if(document.getElementById('play-screen').style.display === 'flex') {
                    layer.style.display = 'block';
                    layer.innerHTML = "";
                    startOverlayFxLoop();
                }
            } else {
                btn.classList.remove('fx-active');
                btn.innerText = "FX: OFF";
                layer.style.display = 'none';
                clearInterval(fxSpawnTimer);
                layer.innerHTML = "";
            }
            autoSaveToStorage();
        }

        function onFxSelectChange() {
            if(isOverlayFxActive) {
                const layer = document.getElementById('fx-overlay-layer');
                layer.innerHTML = "";
                clearInterval(fxSpawnTimer);
                startOverlayFxLoop();
            }
        }

        function startOverlayFxLoop() {
            const layer = document.getElementById('fx-overlay-layer');
            const type = document.getElementById('fx-type-select').value;
            clearInterval(fxSpawnTimer);

            const spawnInterval = (type === 'confetti' || type === 'rose') ? 550 : 750;

            fxSpawnTimer = setInterval(() => {
                if(!isOverlayFxActive) return;

                const elem = document.createElement('div');
                const leftPos = Math.random() * 90 + 2;
                const duration = (Math.random() * 3.5 + 6.5).toFixed(1);

                if(type === 'water') {
                    elem.className = 'fx-water-bubble';
                    const size = Math.floor(Math.random() * 30) + 24;
                    elem.style.width = `${size}px`;
                    elem.style.height = `${size}px`;
                    elem.style.left = `${leftPos}%`;
                    elem.style.animationDuration = `${duration}s`;
                } 
                else if(type === 'glass') {
                    elem.className = 'fx-glass-bubble';
                    const size = Math.floor(Math.random() * 28) + 20;
                    elem.style.width = `${size}px`;
                    elem.style.height = `${size}px`;
                    elem.style.left = `${leftPos}%`;
                    elem.style.animationDuration = `${duration}s`;
                } 
                else if(type === 'star') {
                    elem.className = 'fx-golden-star';
                    elem.innerHTML = '★';
                    elem.style.left = `${leftPos}%`;
                    elem.style.fontSize = `${Math.floor(Math.random() * 14) + 18}px`;
                    elem.style.animationDuration = `${duration}s`;
                } 
                else if(type === 'rose') {
                    elem.className = 'fx-rose-petal';
                    elem.style.left = `${leftPos}%`;
                    elem.style.animationDuration = `${duration}s`;
                } 
                else if(type === 'confetti') {
                    elem.className = 'fx-confetti-piece';
                    const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];
                    elem.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    elem.style.left = `${leftPos}%`;
                    elem.style.animationDuration = `${(Math.random() * 2.5 + 5.5).toFixed(1)}s`;
                } 
                else if(type === 'firefly') {
                    elem.className = 'fx-firefly-orb';
                    const size = Math.floor(Math.random() * 10) + 8;
                    elem.style.width = `${size}px`;
                    elem.style.height = `${size}px`;
                    elem.style.left = `${leftPos}%`;
                    elem.style.animationDuration = `${duration}s`;
                }

                layer.appendChild(elem);

                setTimeout(() => {
                    elem.remove();
                }, duration * 1000);
            }, spawnInterval);
        }

        function handleJumpGo() {
            const inputVal = parseInt(document.getElementById('jump-box').value);
            if(!inputVal || inputVal < 1 || inputVal > qaList.length) {
                alert(`कृपया 1 से ${qaList.length} के बीच का प्रश्न नंबर डालें!`);
                return;
            }

            const targetBatch = Math.floor((inputVal - 1) / 5);
            renderBatch(targetBatch);

            const targetPosInBatch = (inputVal - 1) % 5;
            for(let i = 0; i <= targetPosInBatch; i++) {
                const curAns = document.getElementById(`ans-${i}`);
                if(curAns) curAns.style.display = "block";
            }
            const targetCard = document.getElementById(`item-${targetPosInBatch}`);
            if(targetCard) targetCard.classList.add('active-highlight');

            answerRevealIndex = targetPosInBatch + 1;
            updateControlBtn();
            document.getElementById('jump-box').value = "";
        }

        function updateControlBtn() {
            const btn = document.getElementById('main-next-btn');
            btn.innerText = "Next";
        }

        function returnToCreator() {
            clearInterval(fxSpawnTimer);
            document.getElementById('fx-overlay-layer').style.display = 'none';
            document.getElementById('play-screen').style.display = 'none';
            document.getElementById('creator-screen').style.display = 'flex';
            renderManageList();
        }

        window.onload = function() {
            autoLoadFromStorage();
        };
    </script>
</body>
</html>
