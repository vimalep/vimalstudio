<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viral Quiz Card Studio HD (Smart 11-Line Parser)</title>
    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@600;700;800&family=Kalam:wght@700&family=Poppins:wght@700;800;900&family=Rozha+One&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b1329;
            color: #f8fafc;
            font-family: 'Hind', sans-serif;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-wrap {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .studio-header {
            text-align: center;
            font-size: 19px;
            font-weight: 800;
            color: #38bdf8;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 6px;
            font-family: 'Poppins', sans-serif;
        }

        .control-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .row-flex {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .row-flex > div { flex: 1; }

        label {
            font-size: 11px;
            color: #94a3b8;
            font-weight: bold;
            display: block;
            margin-bottom: 3px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px 10px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 7px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            font-family: inherit;
        }
        textarea { resize: vertical; min-height: 160px; font-family: monospace; font-size: 12px; line-height: 1.4; }

        /* TOGGLE SWITCH FOR ANSWER MODE */
        .answer-toggle-card {
            background: #0f172a;
            border: 1.5px solid #10b981;
            border-radius: 8px;
            padding: 9px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .toggle-text {
            font-size: 13px;
            font-weight: 800;
            color: #34d399;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .checkbox-custom {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #10b981;
        }

        /* ACTION BUTTONS */
        .btn-action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .btn-action {
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-clipboard {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
        }

        .backup-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 2px;
        }
        .btn-backup {
            background: #334155;
            color: #f1f5f9;
            border: 1px solid #475569;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        /* CANVAS PREVIEW */
        .canvas-card {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 8px;
        }
        .btn-act {
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-share {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            box-shadow: 0 3px 10px rgba(37, 99, 235, 0.4);
        }
        .btn-download {
            background: #10b981;
            color: white;
        }
        .btn-history-trigger {
            background: #334155;
            color: #f1f5f9;
            grid-column: span 2;
            border: 1px solid #475569;
        }

        .detail-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 11px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .detail-text {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 9px;
            font-size: 12.5px;
            line-height: 1.5;
            color: #e2e8f0;
            white-space: pre-wrap;
            user-select: text;
        }

        /* HISTORY MODAL */
        #history-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            padding: 16px;
            justify-content: center;
            align-items: center;
        }
        .history-content {
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .history-header {
            padding: 12px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-list {
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .history-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .history-item:hover { border-color: #38bdf8; }
        .h-item-title { font-size: 13px; font-weight: 800; color: #38bdf8; }
        .h-item-sub { font-size: 11.5px; color: #10b981; margin-top: 2px; }
        .h-item-exp { font-size: 11px; color: #94a3b8; margin-top: 4px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="main-wrap">
    <div class="studio-header">⚡ Viral Quiz Card Studio Pro (Smart Paste)</div>

    <!-- CONTROLS & SMART PASTE BOX -->
    <div class="control-box">
        <div>
            <label>📝 यहाँ अपना पूरा 11-लाइन टेक्स्ट पेस्ट करें (Raw Text):</label>
            <textarea id="raw-paste-box">📜 HISTORY GK QUIZ 🧠
Q.168 महात्मा गांधी ने प्रसिद्ध 'दांडी मार्च' (Dandi March) की शुरुआत किस वर्ष की थी? 🚶
        A) 1928 📜
        B) 1930 🌊
        C) 1931 🏛️
        D) 1932 ⚖️
👇 Genius लोग ही Comment में उत्तर दें! 🧠
❤️ Like | ➕ Follow 🎯
Caption: दांडी मार्च और सविनय अवज्ञा आंदोलन / Dandi March Salt Satyagraha (1930) से संबंधित ऐतिहासिक प्रश्न! सही जवाब कमेंट करें। 👇🚀
#HistoryQuiz #IndianHistory #DandiMarch #ModernHistory
Answer: B) 1930 🌊
Explanation: सविनय अवज्ञा आंदोलन की शुरुआत के लिए महात्मा गांधी ने 12 मार्च 1930 को साबरमती आश्रम से दांडी मार्च शुरू किया था, जो 6 अप्रैल 1930 को नमक कानून तोड़कर पूरा हुआ।</textarea>
        </div>

        <div class="btn-action-grid">
            <button class="btn-action btn-clipboard" onclick="pasteFromClipboardAndGenerate()">
                <span>📋 1-Click Paste & Run</span>
            </button>
            <button class="btn-action" onclick="generateFromRawText()">
                <span>✨ Generate Card</span>
            </button>
        </div>

        <div class="row-flex" style="margin-top: 4px;">
            <div>
                <label>फ़ॉन्ट स्टाइल:</label>
                <select id="cfg-font" onchange="saveAllSettings(); redrawCanvas();">
                    <option value="'Hind', sans-serif">Hind (साफ बोल्ड)</option>
                    <option value="'Kalam', cursive">Kalam (आकर्षक लिखावट)</option>
                    <option value="'Rozha One', serif">Rozha One (क्लासिक)</option>
                    <option value="'Poppins', sans-serif">Poppins (मॉडर्न)</option>
                </select>
            </div>
            <div>
                <label>बैकग्राउंड थीम:</label>
                <select id="cfg-bg-color" onchange="saveAllSettings(); redrawCanvas();">
                    <option value="#fef9c3">Soft Warm Yellow</option>
                    <option value="#f8fafc">Creamy Light</option>
                    <option value="#ffffff">Pure White</option>
                    <option value="#ecfdf5">Mint Light</option>
                </select>
            </div>
        </div>

        <div class="row-flex">
            <div>
                <label>प्रश्न साइज़: <span id="q-size-lbl">42</span>px</label>
                <input type="range" id="cfg-q-size" min="30" max="64" value="42" oninput="document.getElementById('q-size-lbl').innerText=this.value; saveAllSettings(); redrawCanvas();">
            </div>
            <div>
                <label>ऑप्शन साइज़: <span id="opt-size-lbl">30</span>px</label>
                <input type="range" id="cfg-opt-size" min="24" max="42" value="30" oninput="document.getElementById('opt-size-lbl').innerText=this.value; saveAllSettings(); redrawCanvas();">
            </div>
        </div>

        <!-- ANSWER MODE TOGGLE -->
        <div class="answer-toggle-card" onclick="toggleAnswerMode()">
            <span class="toggle-text">✅ उत्तर व व्याख्या फोटो में दिखाएं (Answer Mode)</span>
            <input type="checkbox" id="chk-answer-mode" class="checkbox-custom" onclick="event.stopPropagation(); onToggleAnswerChange();">
        </div>

        <!-- JSON BACKUP / RESTORE -->
        <div class="backup-grid">
            <button class="btn-backup" onclick="exportJSONBackup()">📤 Export Backup (JSON)</button>
            <button class="btn-backup" onclick="document.getElementById('import-file').click()">📥 Import Backup (JSON)</button>
            <input type="file" id="import-file" style="display:none" accept=".json" onchange="importJSONBackup(event)">
        </div>
    </div>

    <!-- CANVAS PREVIEW (1080 x 1350) -->
    <div class="canvas-card">
        <canvas id="quizCanvas" width="1080" height="1350"></canvas>
    </div>

    <!-- ACTIONS -->
    <div class="action-grid">
        <button class="btn-act btn-share" onclick="shareDirectly()">📲 Direct Share</button>
        <button class="btn-act btn-download" onclick="downloadImage()">📥 Download HD</button>
        <button class="btn-act btn-history-trigger" onclick="openHistoryModal()">📚 सहेजे गए पुराने प्रश्न (Question Bank)</button>
    </div>

    <!-- PRIVATE EXPLANATION -->
    <div class="detail-card">
        <div class="box-title" style="color: #34d399;">💡 उत्तर एवं विस्तृत व्याख्या:</div>
        <div class="detail-text" id="private-explanation">यहाँ व्याख्या दिखाई देगी।</div>
    </div>

    <!-- FB CAPTION BOX -->
    <div class="detail-card">
        <div class="box-title" style="color: #38bdf8;">📝 Facebook Caption:</div>
        <div class="detail-text" id="fb-caption-box">कैप्शन यहाँ तैयार होकर आएगा...</div>
        <button class="btn-action" style="background:#0284c7; color:white; border:none; padding:8px; margin-top:4px; font-size:12px;" onclick="copyCaption()">📋 Copy Caption</button>
    </div>
</div>

<!-- HISTORY MODAL -->
<div id="history-modal" onclick="closeHistoryModal()">
    <div class="history-content" onclick="event.stopPropagation()">
        <div class="history-header">
            <span style="font-weight: 800; color: #38bdf8; font-size: 14px;">📚 सहेजे गए प्रश्न बैंक (Question Archive)</span>
            <button onclick="document.getElementById('history-modal').style.display='none'" style="background:transparent; border:none; color:white; font-size:18px; cursor:pointer;">✕</button>
        </div>
        <div class="history-list" id="history-items-container"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('quizCanvas');
    const ctx = canvas.getContext('2d');

    const STORAGE_PREFS = "QUIZ_SMARTPASTE_PREFS_V5";
    const STORAGE_HISTORY = "QUIZ_SMARTPASTE_HISTORY_V5";

    let isAnswerRevealed = false;

    let quizData = {
        title: "📜 HISTORY GK QUIZ 🧠",
        qPrefix: "Q.168",
        questionText: "महात्मा गांधी ने प्रसिद्ध 'दांडी मार्च' (Dandi March) की शुरुआत किस वर्ष की थी? 🚶",
        options: {
            A: "1928 📜",
            B: "1930 🌊",
            C: "1931 🏛️",
            D: "1932 ⚖️"
        },
        hook: "👇 Genius लोग ही Comment में उत्तर दें! 🧠",
        social: "❤️ Like | ➕ Follow 🎯",
        correctOption: "B",
        explanation: "सविनय अवज्ञा आंदोलन की शुरुआत के लिए महात्मा गांधी ने 12 मार्च 1930 को साबरमती आश्रम से दांडी मार्च शुरू किया था, जो 6 अप्रैल 1930 को नमक कानून तोड़कर पूरा हुआ।",
        caption: "दांडी मार्च और सविनय अवज्ञा आंदोलन / Dandi March Salt Satyagraha (1930) से संबंधित ऐतिहासिक प्रश्न! सही जवाब कमेंट करें। 👇🚀\n\n#HistoryQuiz #IndianHistory #DandiMarch #ModernHistory"
    };

    function cleanString(str) {
        if (!str) return "";
        // Strip invisible zero-width chars, non-breaking spaces, and trim leading/trailing whitespace
        return str.replace(/[\u200B-\u200D\uFEFF\u00A0]/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function cleanAndMoveEmojiToEnd(text) {
        if (!text) return "";
        let clean = cleanString(text);
        const emojiRegex = /([\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F000}-\u{1F02F}\u{1F0A0}-\u{1F0FF}])/gu;
        const emojisFound = clean.match(emojiRegex);
        const textWithoutEmojis = clean.replace(emojiRegex, '').replace(/\s+/g, ' ').trim();

        if (emojisFound && emojisFound.length > 0) {
            return textWithoutEmojis + " " + emojisFound.join('');
        }
        return textWithoutEmojis;
    }

    // 1-Click Clipboard Paste & Run
    async function pasteFromClipboardAndGenerate() {
        try {
            const text = await navigator.clipboard.readText();
            if (text && text.trim().length > 0) {
                document.getElementById('raw-paste-box').value = text;
                generateFromRawText();
            } else {
                alert("क्लिपबोर्ड खाली है! कृपया पहले टेक्स्ट कॉपी करें।");
            }
        } catch (err) {
            alert("क्लिपबोर्ड एक्सेस की अनुमति नहीं मिली। कृपया बॉक्स में मैन्युअल पेस्ट करके 'Generate Card' दबाएं।");
        }
    }

    /* 11-LINE SMART HYBRID PARSER */
    function generateFromRawText() {
        const raw = document.getElementById('raw-paste-box').value;
        if (!raw || !raw.trim()) {
            alert("कृपया टेक्स्ट बॉक्स में पूरा क्विज़ टेक्स्ट पेस्ट करें!");
            return;
        }

        // Clean out zero-width characters and separate into valid non-empty lines
        const rawLines = raw.split(/\r?\n/)
                            .map(l => cleanString(l))
                            .filter(l => l.length > 0);

        if (rawLines.length < 5) {
            alert("टेक्स्ट बहुत छोटा है! कृपया पूरा फ़ॉर्मेट पेस्ट करें।");
            return;
        }

        let parsedTitle = "";
        let parsedPrefix = "";
        let parsedQText = "";
        let parsedOpts = { A: "", B: "", C: "", D: "" };
        let parsedHook = "👉 Genius लोग ही Comment में उत्तर दें! 🧠";
        let parsedSocial = "❤️ Like | ➕ Follow 🎯";
        let parsedCaptionLines = [];
        let parsedAns = "A";
        let parsedExpLines = [];

        let i = 0;

        // Line 1: Title
        parsedTitle = rawLines[i++];

        // Line 2: Question (with intact Q number)
        let qLine = rawLines[i++];
        let qMatch = qLine.match(/^(Q\.?\s*\d+[\.\:\-\)]*|\d+[\.\:\-\)]*)\s*(.*)/i);
        if (qMatch) {
            parsedPrefix = qMatch[1].trim();
            parsedQText = qMatch[2].trim();
        } else {
            parsedPrefix = "Q.";
            parsedQText = qLine;
        }

        // Lines 3, 4, 5, 6: Options A, B, C, D
        const optKeys = ["A", "B", "C", "D"];
        for (let k = 0; k < 4 && i < rawLines.length; k++) {
            let optLine = rawLines[i++];
            // Remove leading A), B), A., B. or free spaces automatically
            let stripped = optLine.replace(/^[A-Da-d][\)\.\-]\s*/, '').trim();
            parsedOpts[optKeys[k]] = cleanAndMoveEmojiToEnd(stripped);
        }

        // Rest of the lines (7 onwards): Hook, Social, Caption, Answer, Explanation
        let mode = "hook_search";

        while (i < rawLines.length) {
            let line = rawLines[i++];

            // Check for Answer Anchor
            let ansMatch = line.match(/(?:answer|सही उत्तर)\s*[:\-]?\s*([A-Da-d])/i);
            if (ansMatch) {
                parsedAns = ansMatch[1].toUpperCase();
                mode = "post_answer";
                continue;
            }

            // Check for Explanation Anchor
            if (line.toLowerCase().startsWith("explanation:") || line.startsWith("व्याख्या:")) {
                mode = "explanation";
                parsedExpLines.push(line.replace(/^(explanation:|व्याख्या:)\s*/i, '').trim());
                continue;
            }

            // Check for Caption Anchor
            if (line.toLowerCase().startsWith("caption:")) {
                mode = "caption";
                parsedCaptionLines.push(line.replace(/^caption:\s*/i, '').trim());
                continue;
            }

            // Step through sequential lines if anchors not encountered yet
            if (mode === "hook_search") {
                parsedHook = line;
                mode = "social_search";
            } else if (mode === "social_search") {
                parsedSocial = line;
                mode = "caption";
            } else if (mode === "caption") {
                parsedCaptionLines.push(line);
            } else if (mode === "explanation" || mode === "post_answer") {
                parsedExpLines.push(line);
            }
        }

        // Final consolidation
        quizData.title = parsedTitle || "📜 QUIZ STUDIO 🧠";
        quizData.qPrefix = parsedPrefix || "Q.";
        quizData.questionText = parsedQText;
        quizData.options = parsedOpts;
        quizData.hook = parsedHook;
        quizData.social = parsedSocial;
        quizData.correctOption = parsedAns;
        quizData.explanation = parsedExpLines.join(" ") || "व्याख्या उपलब्ध नहीं है।";
        quizData.caption = parsedCaptionLines.length > 0 ? parsedCaptionLines.join("\n") : `${parsedQText} का उत्तर कमेंट करें! 👇🚀`;

        saveToHistory({
            title: quizData.title,
            qPrefix: quizData.qPrefix,
            questionText: quizData.questionText,
            options: quizData.options,
            correctOption: quizData.correctOption,
            explanation: quizData.explanation,
            caption: quizData.caption,
            hook: quizData.hook,
            social: quizData.social,
            rawText: raw
        });

        updateCaptionText();
        saveAllSettings();
        redrawCanvas();

        // Automatically copy FB caption to clipboard for effortless workflow
        navigator.clipboard.writeText(quizData.caption).catch(() => {});
        alert(`🎉 ${quizData.qPrefix} का कार्ड तैयार हो गया है और फेसबुक कैप्शन क्लिपबोर्ड पर कॉपी कर दिया गया है!`);
    }

    function toggleAnswerMode() {
        const chk = document.getElementById('chk-answer-mode');
        chk.checked = !chk.checked;
        onToggleAnswerChange();
    }

    function onToggleAnswerChange() {
        isAnswerRevealed = document.getElementById('chk-answer-mode').checked;
        updateCaptionText();
        saveAllSettings();
        redrawCanvas();
    }

    function updateCaptionText() {
        if (isAnswerRevealed) {
            const correctText = quizData.options[quizData.correctOption] || "";
            document.getElementById('fb-caption-box').innerText = 
`✅ सही उत्तर: [विकल्प ${quizData.correctOption}] ${correctText}

📖 व्याख्या: ${quizData.explanation}

#QuizQuestions #ExamPreparation`;
        } else {
            document.getElementById('fb-caption-box').innerText = quizData.caption;
        }
        document.getElementById('private-explanation').innerText = `[सही उत्तर: ${quizData.correctOption}]\n\n${quizData.explanation}`;
    }

    function saveAllSettings() {
        const prefs = {
            fontFam: document.getElementById('cfg-font').value,
            bgColor: document.getElementById('cfg-bg-color').value,
            qSize: parseInt(document.getElementById('cfg-q-size').value) || 42,
            optSize: parseInt(document.getElementById('cfg-opt-size').value) || 30,
            isAnswerMode: document.getElementById('chk-answer-mode').checked,
            rawText: document.getElementById('raw-paste-box').value,
            currentQuiz: quizData
        };
        localStorage.setItem(STORAGE_PREFS, JSON.stringify(prefs));
    }

    function loadAllSettings() {
        const saved = localStorage.getItem(STORAGE_PREFS);
        if (saved) {
            try {
                const p = JSON.parse(saved);
                if (p.fontFam) document.getElementById('cfg-font').value = p.fontFam;
                if (p.bgColor) document.getElementById('cfg-bg-color').value = p.bgColor;
                if (p.qSize) {
                    document.getElementById('cfg-q-size').value = p.qSize;
                    document.getElementById('q-size-lbl').innerText = p.qSize;
                }
                if (p.optSize) {
                    document.getElementById('cfg-opt-size').value = p.optSize;
                    document.getElementById('opt-size-lbl').innerText = p.optSize;
                }
                if (p.isAnswerMode !== undefined) {
                    document.getElementById('chk-answer-mode').checked = p.isAnswerMode;
                    isAnswerRevealed = p.isAnswerMode;
                }
                if (p.rawText) {
                    document.getElementById('raw-paste-box').value = p.rawText;
                }
                if (p.currentQuiz) {
                    quizData = p.currentQuiz;
                }
            } catch(e) {}
        }
    }

    /* JSON BACKUP & RESTORE */
    function exportJSONBackup() {
        const backupData = {
            prefs: localStorage.getItem(STORAGE_PREFS),
            history: localStorage.getItem(STORAGE_HISTORY)
        };
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2)));
        downloadAnchor.setAttribute("download", `QuizStudio_Backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importJSONBackup(event) {
        const fileReader = new FileReader();
        if (event.target.files[0]) {
            fileReader.readAsText(event.target.files[0], "UTF-8");
            fileReader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.prefs) localStorage.setItem(STORAGE_PREFS, parsed.prefs);
                    if (parsed.history) localStorage.setItem(STORAGE_HISTORY, parsed.history);
                    loadAllSettings();
                    updateCaptionText();
                    redrawCanvas();
                    alert("✅ बैकअप सफलतापूर्वक रिस्टोर हो गया है!");
                } catch (err) {
                    alert("त्रुटि: अमान्य JSON फ़ाइल!");
                }
            };
        }
    }

    function saveToHistory(item) {
        let history = [];
        try {
            history = JSON.parse(localStorage.getItem(STORAGE_HISTORY)) || [];
        } catch(e) {}
        history = history.filter(h => h.qPrefix !== item.qPrefix);
        history.unshift(item);
        if (history.length > 100) history.pop();
        localStorage.setItem(STORAGE_HISTORY, JSON.stringify(history));
    }

    function openHistoryModal() {
        const modal = document.getElementById('history-modal');
        const container = document.getElementById('history-items-container');
        container.innerHTML = "";

        let history = [];
        try {
            history = JSON.parse(localStorage.getItem(STORAGE_HISTORY)) || [];
        } catch(e) {}

        if (history.length === 0) {
            container.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:20px; font-size:13px;">अभी तक कोई पुराना प्रश्न सहेजा नहीं गया है।</div>`;
        } else {
            history.forEach((h) => {
                const div = document.createElement('div');
                div.className = "history-item";
                div.innerHTML = `
                    <div class="h-item-title">${h.qPrefix}: ${h.questionText}</div>
                    <div class="h-item-sub">✅ सही उत्तर: [${h.correctOption}] ${h.options[h.correctOption] || ""}</div>
                    <div class="h-item-exp">📖 ${h.explanation}</div>
                `;
                div.onclick = () => {
                    loadFromHistory(h);
                    modal.style.display = 'none';
                };
                container.appendChild(div);
            });
        }
        modal.style.display = 'flex';
    }

    function closeHistoryModal() {
        document.getElementById('history-modal').style.display = 'none';
    }

    function loadFromHistory(h) {
        quizData = JSON.parse(JSON.stringify(h));
        if (h.rawText) document.getElementById('raw-paste-box').value = h.rawText;
        updateCaptionText();
        redrawCanvas();
        alert(`✅ ${h.qPrefix} लोड कर दिया गया है!`);
    }

    /* REDRAW CANVAS WITH GEMINI HIGH-FIDELITY DESIGN */
    function redrawCanvas() {
        const bgColor = document.getElementById('cfg-bg-color').value;
        const fontFam = document.getElementById('cfg-font').value;
        const qSize = parseInt(document.getElementById('cfg-q-size').value) || 42;
        const optSize = parseInt(document.getElementById('cfg-opt-size').value) || 30;

        ctx.clearRect(0, 0, 1080, 1350);

        // Background Outer
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, 1080, 1350);

        // White Container Card
        const cardX = 42;
        const cardY = 42;
        const cardW = 996;
        const cardH = 1266;
        const cardRadius = 32;

        roundRect(ctx, cardX, cardY, cardW, cardH, cardRadius, "#ffffff", false);
        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 3;
        roundRect(ctx, cardX, cardY, cardW, cardH, cardRadius, null, true);

        // Security Watermark
        ctx.save();
        ctx.beginPath();
        roundRect(ctx, cardX, cardY, cardW, cardH, cardRadius, null, false);
        ctx.clip();
        ctx.rotate(-28 * Math.PI / 180);
        ctx.fillStyle = "rgba(15, 23, 42, 0.02)";
        ctx.font = "900 42px 'Poppins', sans-serif";
        for (let x = -800; x < 1800; x += 360) {
            for (let y = -600; y < 2000; y += 160) {
                ctx.fillText("EXAM PREPARATION", x, y);
            }
        }
        ctx.restore();

        // Line 1: Header Title (Auto from Line 1)
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#0f172a";
        ctx.font = `900 52px ${fontFam}`;
        ctx.fillText(quizData.title, 540, 118);

        // Badge Pill: "EXAM PREPARATION"
        const pillW = 500;
        const pillH = 56;
        const pillX = (1080 - pillW) / 2;
        const pillY = 162;

        roundRect(ctx, pillX, pillY, pillW, pillH, 28, "#f1f5f9", false);
        ctx.strokeStyle = "#cbd5e1";
        ctx.lineWidth = 2;
        roundRect(ctx, pillX, pillY, pillW, pillH, 28, null, true);

        ctx.fillStyle = "#1e293b";
        ctx.font = "900 26px 'Poppins', sans-serif";
        ctx.fillText("EXAM PREPARATION", 540, pillY + (pillH / 2));

        // Line 2: Question Section (Fixed 72px gap below pill)
        ctx.textAlign = "left";
        const fixedGap = 72;
        const qStartY = pillY + pillH + fixedGap;
        const qEndY = drawColorfulQuestion(ctx, quizData.qPrefix, quizData.questionText, 95, qStartY, 890, qSize, fontFam);

        // Lines 3-6: 4 Options Containers (A, B, C, D)
        const optStartY = qEndY + 36;
        const optGap = 124;
        const optW = 890;
        const optH = 94;
        const optX = 95;

        const optStyles = [
            { bg: "#eff6ff", border: "#93c5fd", badgeBg: "#2563eb", text: "#1e3a8a", label: "A" },
            { bg: "#ecfdf5", border: "#a7f3d0", badgeBg: "#059669", text: "#064e3b", label: "B" },
            { bg: "#fffbeb", border: "#fde68a", badgeBg: "#d97706", text: "#78350f", label: "C" },
            { bg: "#faf5ff", border: "#e9d5ff", badgeBg: "#9333ea", text: "#581c87", label: "D" }
        ];

        optStyles.forEach((st, idx) => {
            const curY = optStartY + (idx * optGap);
            const isCorrect = (quizData.correctOption === st.label);

            let boxBg = st.bg;
            let boxBorder = st.border;
            let badgeBg = st.badgeBg;
            let badgeText = st.label;

            if (isAnswerRevealed && isCorrect) {
                boxBg = "#dcfce7";
                boxBorder = "#16a34a";
                badgeBg = "#15803d";
                badgeText = "✔";
            }

            roundRect(ctx, optX, curY, optW, optH, 20, boxBg, false);
            ctx.strokeStyle = boxBorder;
            ctx.lineWidth = (isAnswerRevealed && isCorrect) ? 4 : 2.5;
            roundRect(ctx, optX, curY, optW, optH, 20, null, true);

            // Badge
            roundRect(ctx, optX + 16, curY + 16, 62, 62, 14, badgeBg, false);
            ctx.fillStyle = "#ffffff";
            ctx.font = `900 ${(badgeText === '✔') ? 34 : 28}px 'Poppins', sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(badgeText, optX + 47, curY + (optH / 2));

            // Option Text
            ctx.textAlign = "left";
            ctx.fillStyle = (isAnswerRevealed && isCorrect) ? "#14532d" : st.text;
            ctx.font = `700 ${optSize}px ${fontFam}`;
            const optString = quizData.options[st.label] || "";
            ctx.fillText(optString, optX + 96, curY + (optH / 2));
        });

        // Lines 7 & 8 / Footer Section
        const footerY = optStartY + (4 * optGap) + 38;

        if (isAnswerRevealed) {
            roundRect(ctx, 95, footerY, 890, 165, 18, "#f8fafc", false);
            ctx.strokeStyle = "#16a34a";
            ctx.lineWidth = 2.5;
            roundRect(ctx, 95, footerY, 890, 165, 18, null, true);

            ctx.fillStyle = "#15803d";
            ctx.font = `800 24px ${fontFam}`;
            ctx.textAlign = "left";
            ctx.textBaseline = "top";
            ctx.fillText(`💡 सही उत्तर: [विकल्प ${quizData.correctOption}] ${quizData.options[quizData.correctOption]}`, 120, footerY + 24);

            ctx.fillStyle = "#334155";
            ctx.font = `600 20px ${fontFam}`;
            wrapTextSimple(ctx, quizData.explanation, 120, footerY + 68, 840, 28);

            ctx.fillStyle = "#64748b";
            ctx.font = `800 22px ${fontFam}`;
            ctx.textAlign = "center";
            ctx.fillText(quizData.social || "❤️ Like | ➕ Follow | 🎯 Share", 540, footerY + 205);
        } else {
            // Line 7: Hook Banner
            roundRect(ctx, 110, footerY, 860, 80, 40, "#fef08a", false);
            ctx.strokeStyle = "#facc15";
            ctx.lineWidth = 2.5;
            roundRect(ctx, 110, footerY, 860, 80, 40, null, true);

            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#854d0e";
            ctx.font = `800 28px ${fontFam}`;
            ctx.fillText(quizData.hook, 540, footerY + (80 / 2));

            // Line 8: Social Line
            ctx.fillStyle = "#0f172a";
            ctx.font = `800 28px ${fontFam}`;
            ctx.fillText(quizData.social, 540, footerY + 132);
        }
    }

    /* QUESTION TEXT WITH SEPARATE ROYAL BLUE PREFIX AND RED KEYWORDS */
    function drawColorfulQuestion(ctx, prefix, text, x, y, maxW, fontSize, fontFam) {
        ctx.textBaseline = "top";
        ctx.font = `900 ${fontSize + 2}px 'Poppins', sans-serif`;
        ctx.fillStyle = "#0284c7"; // Royal Sky Blue for Question Prefix
        const fullPrefix = prefix + " ";
        const prefixWidth = ctx.measureText(fullPrefix).width;
        ctx.fillText(fullPrefix, x, y);

        const highlightTokens = ["कौन-सी", "कौन-सा", "कहाँ", "किस", "किसे", "कितने", "कब", "एकमात्र", "केवल", "प्रमुख", "सबसे", "प्रथम", "नहीं", "तहत", "समान", "दृष्टि", "लंबी", "स्थलीय", "प्रसिद्ध", "शुरुआत", "वर्ष"];
        
        ctx.font = `800 ${fontSize}px ${fontFam}`;
        const words = text.split(' ');
        let curX = x + prefixWidth;
        let curY = y;
        const lineH = Math.round(fontSize * 1.38);

        words.forEach(word => {
            const cleanWord = word.replace(/[?,.!"']/g, '');
            const isHighlight = highlightTokens.some(t => cleanWord.includes(t)) || word.startsWith("'") || word.startsWith('"');
            
            ctx.fillStyle = isHighlight ? "#dc2626" : "#0f172a";
            const wordW = ctx.measureText(word + ' ').width;

            if (curX + wordW > x + maxW) {
                curX = x;
                curY += lineH;
            }

            ctx.fillText(word + ' ', curX, curY);
            curX += wordW;
        });

        return curY + lineH;
    }

    function wrapTextSimple(ctx, text, x, y, maxW, lineH) {
        ctx.textBaseline = "top";
        const words = text.split(' ');
        let line = '';
        for (let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            let metrics = ctx.measureText(testLine);
            if (metrics.width > maxW && n > 0) {
                ctx.fillText(line, x, y);
                line = words[n] + ' ';
                y += lineH;
            } else {
                line = testLine;
            }
        }
        ctx.fillText(line, x, y);
    }

    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        if (fill) { ctx.fillStyle = fill; ctx.fill(); }
        if (stroke) ctx.stroke();
    }

    async function shareDirectly() {
        const caption = document.getElementById('fb-caption-box').innerText;
        canvas.toBlob(async (blob) => {
            if (!blob) { alert("इमेज तैयार नहीं हो सकी!"); return; }
            const file = new File([blob], `Quiz_${quizData.qPrefix}.png`, { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ title: `Quiz ${quizData.qPrefix}`, text: caption, files: [file] });
                } catch (err) {}
            } else {
                downloadImage();
                copyCaption();
                alert("डायरेक्ट शेयर समर्थित नहीं है। फ़ोटो डाउनलोड और कैप्शन कॉपी हो गया है!");
            }
        });
    }

    function downloadImage() {
        const link = document.createElement('a');
        const modePrefix = isAnswerRevealed ? "Solved_" : "";
        link.download = `${modePrefix}Quiz_${quizData.qPrefix.replace(/[^a-zA-Z0-9]/g, '_')}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    function copyCaption() {
        const cap = document.getElementById('fb-caption-box').innerText;
        navigator.clipboard.writeText(cap).then(() => {
            alert("📋 फेसबुक कैप्शन कॉपी हो गया है!");
        });
    }

    window.onload = function() {
        loadAllSettings();
        updateCaptionText();
        redrawCanvas();
    };
</script>
