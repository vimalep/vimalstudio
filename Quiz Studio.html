<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viral Quiz Studio - FB Feed Multi-Sheet Compiler</title>
    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@600;700;800&family=Kalam:wght@700&family=Poppins:wght@700;800;900&family=Rozha+One&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b1329;
            color: #f8fafc;
            font-family: 'Hind', sans-serif;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-wrap {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .studio-header {
            text-align: center;
            font-size: 18px;
            font-weight: 800;
            color: #38bdf8;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 6px;
            font-family: 'Poppins', sans-serif;
        }

        .control-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .row-flex {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .row-flex > div { flex: 1; }

        label {
            font-size: 11px;
            color: #94a3b8;
            font-weight: bold;
            display: block;
            margin-bottom: 3px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px 10px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 7px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            font-family: inherit;
        }
        textarea { resize: vertical; min-height: 130px; font-family: monospace; font-size: 12px; line-height: 1.4; }

        .btn-action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .btn-action {
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            color: white;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-clipboard {
            background: linear-gradient(135deg, #0284c7, #0369a1);
        }

        /* COMPILER CARD */
        .compiler-box {
            background: #1e1b4b;
            border: 1.5px solid #6366f1;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-compile {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }

        .page-navigation {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #475569;
        }
        .btn-nav {
            background: #334155;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; }

        .canvas-card {
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .btn-act {
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: white;
        }
        .btn-share { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .btn-download { background: #10b981; }
        .btn-download-all { background: #0891b2; grid-column: span 2; }

        .detail-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 11px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .detail-text {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 9px;
            font-size: 12px;
            line-height: 1.5;
            color: #e2e8f0;
            white-space: pre-wrap;
            max-height: 160px;
            overflow-y: auto;
            user-select: text;
        }
    </style>
</head>
<body>

<div class="main-wrap">
    <div class="studio-header">⚡ FB Feed Multi-Sheet Compiler (1080 x 1350)</div>

    <!-- PASTE BOX -->
    <div class="control-box">
        <div>
            <label>📝 यहाँ क्विज़ टेक्स्ट पेस्ट करें (ऑटो सेव होगा):</label>
            <textarea id="raw-paste-box">🏛️ POLITY GK QUIZ 🧠
Q.169 संविधान की प्रारूप समिति (Drafting Committee) के अध्यक्ष कौन थे? ⚖️
A) डॉ. राजेंद्र प्रसाद 📜
B) डॉ. भीमराव अंबेडकर 🇮🇳
C) जवाहरलाल नेहरू 🏛️
D) सरदार वल्लभभाई पटेल 🛡️
👇 1 Second में सही उत्तर Comment करें! ⚡
❤️ Like | ➕ Follow 🎯
Caption: संविधान की प्रारूप समिति के अध्यक्ष / Chairman of Drafting Committee से जुड़ा महत्वपूर्ण प्रश्न!
#PolityQuiz #IndianConstitution #ExamPreparation
Answer: B) डॉ. भीमराव अंबेडकर 🇮🇳
Explanation: 29 अगस्त 1947 को गठित संविधान सभा की प्रारूप समिति में कुल 7 सदस्य थे, जिसके अध्यक्ष डॉ. भीमराव अंबेडकर थे।</textarea>
        </div>

        <div class="btn-action-grid">
            <button class="btn-action btn-clipboard" onclick="pasteFromClipboardAndSave()">
                <span>📋 1-Click Paste & Save</span>
            </button>
            <button class="btn-action" onclick="parseAndSaveQuestion()">
                <span>💾 Save To Bank</span>
            </button>
        </div>
        <div style="font-size:12px; color:#38bdf8; font-weight:700; text-align:center;">
            📚 कुल सहेजे गए प्रश्न: <span id="total-saved-count">0</span>
        </div>
    </div>

    <!-- 10-QUESTION SHEET COMPILER CONTROLS -->
    <div class="compiler-box">
        <div style="font-weight: 800; color: #c7d2fe; font-size: 14px;">
            📑 Facebook Feed Sheet Generator (10Q: 5 Left + 5 Right)
        </div>
        <div class="row-flex">
            <div>
                <label>प्रारंभिक प्रश्न (Start Index):</label>
                <input type="number" id="cfg-start-idx" min="1" value="1" onchange="updatePageEstimate()">
            </div>
            <div>
                <label>कुल चुने गए प्रश्न (Count):</label>
                <input type="number" id="cfg-total-count" min="1" max="100" value="10" onchange="updatePageEstimate()">
            </div>
        </div>
        <div style="font-size:11.5px; color:#93c5fd;" id="page-estimate-text">
            ℹ️ कुल पेजों की संख्या: 1 इमेज (10 प्रश्न)
        </div>

        <button class="btn-compile" onclick="compileBatchSheets()">🚀 इमेज तैयार करें (Compile Sheets)</button>
    </div>

    <!-- PAGE NAVIGATION & PREVIEW -->
    <div class="page-navigation" id="nav-container" style="display:none;">
        <button class="btn-nav" id="btn-prev" onclick="changePage(-1)">◀ पिछला पेज</button>
        <span style="font-size:13px; font-weight:800; color:#38bdf8;" id="page-indicator">Page 1 of 1</span>
        <button class="btn-nav" id="btn-next" onclick="changePage(1)">अगला पेज ▶</button>
    </div>

    <!-- CANVAS PREVIEW (1080 x 1350 Feed Aspect) -->
    <div class="canvas-card">
        <canvas id="feedCanvas" width="1080" height="1350"></canvas>
    </div>

    <!-- ACTIONS -->
    <div class="action-grid">
        <button class="btn-act btn-share" onclick="shareCurrentSheet()">📲 Share Current Page</button>
        <button class="btn-act btn-download" onclick="downloadCurrentSheet()">📥 Download (JPG)</button>
        <button class="btn-act btn-download-all" id="btn-download-all" onclick="downloadAllSheets()">📦 सभी पेजों को एक साथ डाउनलोड करें (Download All)</button>
    </div>

    <!-- FB CAPTION BOX -->
    <div class="detail-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight: 800; color: #38bdf8; font-size: 13px;">📝 Facebook Post Caption:</span>
            <button class="btn-action" style="background:#0284c7; padding:4px 10px; font-size:11.5px;" onclick="copyPostCaption()">📋 Copy Caption</button>
        </div>
        <div class="detail-text" id="fb-caption-box">शीट कंपाइल करने के बाद यहाँ कैप्शन तैयार होगा...</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('feedCanvas');
    const ctx = canvas.getContext('2d');

    const STORAGE_KEY = "EXAM_PREP_FB_FEED_QUESTIONS_V1";
    let compiledPages = []; // Array of arrays containing up to 10 questions each
    let currentPageIndex = 0;

    function cleanString(str) {
        if (!str) return "";
        return str.replace(/[\u200B-\u200F\uFEFF\u00A0\u202A-\u202E]/g, '').trim();
    }

    function cleanAndMoveEmojiToEnd(text) {
        if (!text) return "";
        let clean = cleanString(text).replace(/\s+/g, ' ');
        const emojiRegex = /([\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F000}-\u{1F02F}\u{1F0A0}-\u{1F0FF}])/gu;
        const emojisFound = clean.match(emojiRegex);
        const textWithoutEmojis = clean.replace(emojiRegex, '').replace(/\s+/g, ' ').trim();
        if (emojisFound && emojisFound.length > 0) {
            return textWithoutEmojis + " " + emojisFound.join('');
        }
        return textWithoutEmojis;
    }

    function getQuestionsBank() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { return []; }
    }

    function saveQuestionsBank(bank) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(bank));
        document.getElementById('total-saved-count').innerText = bank.length;
    }

    async function pasteFromClipboardAndSave() {
        try {
            const text = await navigator.clipboard.readText();
            if (text && text.trim().length > 0) {
                document.getElementById('raw-paste-box').value = text;
                parseAndSaveQuestion();
            } else {
                alert("क्लिपबोर्ड खाली है!");
            }
        } catch (err) {
            alert("क्लिपबोर्ड एक्सेस की अनुमति नहीं मिली। बॉक्स में सीधे पेस्ट करें।");
        }
    }

    function parseAndSaveQuestion() {
        const raw = document.getElementById('raw-paste-box').value;
        if (!raw || !raw.trim()) {
            alert("कृपया टेक्स्ट पेस्ट करें!");
            return;
        }

        const lines = raw.split(/\r?\n/).map(l => cleanString(l)).filter(l => l.length > 0);
        if (lines.length < 4) {
            alert("टेक्स्ट बहुत छोटा है!");
            return;
        }

        let parsedPrefix = "Q.";
        let parsedQText = "";
        let parsedOpts = { A: "", B: "", C: "", D: "" };
        let parsedAns = "A";
        let parsedExpLines = [];

        let state = "TITLE";

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i];

            if (/^(?:Answer|Ans|उत्तर|सही\s*उत्तर)\s*[:\-]/i.test(line)) {
                state = "ANSWER";
                let ansMatch = line.match(/^(?:Answer|Ans|उत्तर|सही\s*उत्तर)\s*[:\-]\s*([A-Da-d])/i);
                if (ansMatch) parsedAns = ansMatch[1].toUpperCase();
                continue;
            }

            if (/^(?:Explanation|व्याख्या)\s*[:\-]/i.test(line)) {
                state = "EXPLANATION";
                let expText = line.replace(/^(?:Explanation|व्याख्या)\s*[:\-]\s*/i, '').trim();
                if (expText) parsedExpLines.push(expText);
                continue;
            }

            if (state === "TITLE") {
                state = "QUESTION";
                continue;
            }

            if (state === "QUESTION") {
                let qMatch = line.match(/^(Q\.?\s*\d+[\.\:\-\)]*|\d+[\.\:\-\)]*)\s*(.*)/i);
                if (qMatch) {
                    parsedPrefix = qMatch[1].trim();
                    parsedQText = qMatch[2].trim();
                } else {
                    parsedQText = line;
                }
                state = "OPTIONS";
                continue;
            }

            if (state === "OPTIONS") {
                let optMatch = line.match(/^([A-Da-d])[\)\.\-]\s*(.*)/);
                if (optMatch) {
                    let key = optMatch[1].toUpperCase();
                    parsedOpts[key] = cleanAndMoveEmojiToEnd(optMatch[2]);
                    continue;
                }
            }

            if (state === "EXPLANATION") {
                parsedExpLines.push(line);
            }
        }

        const newQ = {
            id: Date.now(),
            prefix: parsedPrefix,
            questionText: parsedQText,
            options: parsedOpts,
            correctOption: parsedAns,
            explanation: parsedExpLines.join(" ") || "प्रामाणिक उत्तर विकल्प पर आधारित है।"
        };

        const bank = getQuestionsBank();
        bank.push(newQ);
        saveQuestionsBank(bank);
        updatePageEstimate();
        alert(`✅ प्रश्न ${newQ.prefix} सफलतापूर्वक सेव हो गया! (कुल प्रश्न: ${bank.length})`);
    }

    function updatePageEstimate() {
        const total = parseInt(document.getElementById('cfg-total-count').value) || 10;
        const pages = Math.ceil(total / 10);
        document.getElementById('page-estimate-text').innerText = `ℹ️ कुल पेजों की संख्या: ${pages} इमेज (${total} प्रश्न)`;
    }

    /* COMPILER LOGIC (Splits questions into 10 per page) */
    function compileBatchSheets() {
        const bank = getQuestionsBank();
        if (bank.length === 0) {
            alert("प्रश्न बैंक खाली है! कृपया पहले प्रश्न जोड़ें।");
            return;
        }

        const startIdx = Math.max(0, (parseInt(document.getElementById('cfg-start-idx').value) || 1) - 1);
        const count = parseInt(document.getElementById('cfg-total-count').value) || 10;

        const slice = bank.slice(startIdx, startIdx + count);
        if (slice.length === 0) {
            alert("चयनित रेंज में कोई प्रश्न उपलब्ध नहीं हैं!");
            return;
        }

        compiledPages = [];
        for (let i = 0; i < slice.length; i += 10) {
            compiledPages.push(slice.slice(i, i + 10));
        }

        currentPageIndex = 0;
        document.getElementById('nav-container').style.display = compiledPages.length > 1 ? "flex" : "none";
        renderCurrentPage();
        generateBatchCaption(slice);
    }

    function changePage(delta) {
        currentPageIndex += delta;
        currentPageIndex = Math.max(0, Math.min(currentPageIndex, compiledPages.length - 1));
        renderCurrentPage();
    }

    function renderCurrentPage() {
        if (!compiledPages[currentPageIndex]) return;

        document.getElementById('page-indicator').innerText = `Page ${currentPageIndex + 1} of ${compiledPages.length}`;
        document.getElementById('btn-prev').disabled = (currentPageIndex === 0);
        document.getElementById('btn-next').disabled = (currentPageIndex === compiledPages.length - 1);

        const currentSet = compiledPages[currentPageIndex];
        const pageNum = currentPageIndex + 1;
        const totalPages = compiledPages.length;

        drawFeedSheet(currentSet, pageNum, totalPages);
    }

    /* CANVAS DRAWING (1080 x 1350 FB Feed) */
    function drawFeedSheet(questions, pageNum, totalPages) {
        const W = 1080;
        const H = 1350;

        ctx.clearRect(0, 0, W, H);

        // Background
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, W, H);

        // Elegant Outer Border
        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 4;
        ctx.strokeRect(18, 18, W - 36, H - 36);

        // Security Watermark 2% (0.02)
        ctx.save();
        ctx.rotate(-28 * Math.PI / 180);
        ctx.fillStyle = "rgba(15, 23, 42, 0.02)";
        ctx.font = "900 42px 'Poppins', sans-serif";
        for (let x = -600; x < 1800; x += 360) {
            for (let y = -600; y < 2000; y += 160) {
                ctx.fillText("EXAM PREPARATION", x, y);
            }
        }
        ctx.restore();

        // 🎯 1. BRANDING CAPSULE (Auto-fit to Text Width)
        const brandText = totalPages > 1 ? `EXAM PREPARATION • PART ${pageNum}` : "EXAM PREPARATION";
        ctx.font = "900 24px 'Poppins', sans-serif";
        const textMetrics = ctx.measureText(brandText);
        const padX = 24;
        const pillW = textMetrics.width + (padX * 2);
        const pillH = 44;
        const pillX = (W - pillW) / 2;
        const pillY = 32;

        roundRect(ctx, pillX, pillY, pillW, pillH, 22, "#f1f5f9", false);
        ctx.strokeStyle = "#cbd5e1";
        ctx.lineWidth = 1.8;
        roundRect(ctx, pillX, pillY, pillW, pillH, 22, null, true);

        ctx.fillStyle = "#0f172a";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(brandText, W / 2, pillY + (pillH / 2));

        // 🎯 2. VIRAL HOOK (Directly Under Capsule)
        const hookY = pillY + pillH + 12;
        roundRect(ctx, 42, hookY, W - 84, 52, 14, "#fef08a", false);
        ctx.strokeStyle = "#facc15";
        ctx.lineWidth = 2;
        roundRect(ctx, 42, hookY, W - 84, 52, 14, null, true);

        ctx.fillStyle = "#854d0e";
        ctx.font = "800 24px 'Hind', sans-serif";
        ctx.fillText("👇 10 में से 7 सही उत्तर देकर अपनी तैयारी परखें! ⚡", W / 2, hookY + 26);

        // 🎯 3. 10 QUESTIONS GRID (5 Left + 5 Right)
        const colW = 488;
        const leftX = 36;
        const rightX = W - colW - 36;
        const gridStartY = hookY + 66;
        const blockH = 224;
        const blockGap = 8;

        questions.forEach((q, idx) => {
            const isRight = idx >= 5;
            const rIdx = isRight ? (idx - 5) : idx;
            const x = isRight ? rightX : leftX;
            const y = gridStartY + (rIdx * (blockH + blockGap));

            drawQuestionItem(ctx, q, idx + 1, x, y, colW, blockH);
        });

        // 🎯 4. FOOTER ENGAGEMENT BAR
        const footerY = H - 68;
        roundRect(ctx, 36, footerY, W - 72, 46, 12, "#0f172a", false);
        ctx.fillStyle = "#ffffff";
        ctx.font = "800 20px 'Hind', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("❤️ Like | ➕ Follow @ExamPreparation | 🎯 दोस्तों के साथ शेयर करें", W / 2, footerY + 23);
    }

    function drawQuestionItem(ctx, q, num, x, y, w, h) {
        // Container
        roundRect(ctx, x, y, w, h, 10, "#f8fafc", false);
        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 1.5;
        roundRect(ctx, x, y, w, h, 10, null, true);

        // Question Title
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillStyle = "#0284c7";
        ctx.font = "800 18px 'Hind', sans-serif";
        const title = `${num}. ${q.questionText}`;
        wrapText(ctx, title, x + 10, y + 8, w - 20, 22, 2);

        // Options (2 x 2)
        const optW = (w - 26) / 2;
        const optH = 25;
        const optStartY = y + 56;
        const keys = ["A", "B", "C", "D"];

        keys.forEach((k, ki) => {
            const isR = (ki % 2 === 1);
            const isR2 = (ki >= 2);
            const ox = isR ? (x + 16 + optW) : (x + 10);
            const oy = isR2 ? (optStartY + optH + 4) : optStartY;
            const isAns = (q.correctOption === k);

            roundRect(ctx, ox, oy, optW, optH, 5, isAns ? "#dcfce7" : "#ffffff", false);
            ctx.strokeStyle = isAns ? "#22c55e" : "#cbd5e1";
            ctx.lineWidth = 1;
            roundRect(ctx, ox, oy, optW, optH, 5, null, true);

            ctx.fillStyle = isAns ? "#15803d" : "#334155";
            ctx.font = isAns ? "800 14px 'Hind', sans-serif" : "600 14px 'Hind', sans-serif";
            const optStr = `${k}) ${q.options[k] || ""}`;
            ctx.fillText(truncate(ctx, optStr, optW - 10), ox + 6, oy + 4);
        });

        // Explanation Box
        const expY = optStartY + (optH * 2) + 10;
        const expH = (y + h - 8) - expY;

        roundRect(ctx, x + 10, expY, w - 20, expH, 6, "#ecfdf5", false);
        ctx.strokeStyle = "#a7f3d0";
        ctx.lineWidth = 1;
        roundRect(ctx, x + 10, expY, w - 20, expH, 6, null, true);

        ctx.fillStyle = "#065f46";
        ctx.font = "800 14px 'Hind', sans-serif";
        ctx.fillText(`💡 उत्तर: [${q.correctOption}] | व्याख्या:`, x + 16, expY + 6);

        ctx.fillStyle = "#1e293b";
        ctx.font = "600 13px 'Hind', sans-serif";
        wrapText(ctx, q.explanation, x + 16, expY + 25, w - 32, 17, 4);
    }

    function wrapText(ctx, text, x, y, maxW, lineH, maxLines = 10) {
        const words = (text || "").split(' ');
        let line = '';
        let lineCount = 0;

        for (let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            let metrics = ctx.measureText(testLine);
            if (metrics.width > maxW && n > 0) {
                lineCount++;
                if (lineCount >= maxLines) {
                    ctx.fillText(line.trim() + "...", x, y);
                    return;
                }
                ctx.fillText(line, x, y);
                line = words[n] + ' ';
                y += lineH;
            } else {
                line = testLine;
            }
        }
        ctx.fillText(line, x, y);
    }

    function truncate(ctx, text, maxW) {
        if (ctx.measureText(text).width <= maxW) return text;
        while (ctx.measureText(text + "...").width > maxW && text.length > 0) {
            text = text.substring(0, text.length - 1);
        }
        return text + "...";
    }

    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        if (fill) { ctx.fillStyle = fill; ctx.fill(); }
        if (stroke) ctx.stroke();
    }

    function generateBatchCaption(questions) {
        let text = `🔥 EXAM SPECIAL TEST SERIES (टॉप ${questions.length} अति-महत्वपूर्ण प्रश्नोत्तर) 🎯\n\n`;
        questions.slice(0, 10).forEach((q, i) => {
            text += `${i + 1}. ${q.questionText}\n`;
        });
        if (questions.length > 10) {
            text += `... और अन्य सभी प्रश्न ऊपर इमेज में देखें!\n`;
        }
        text += `\n✅ सटीक व प्रामाणिक व्याख्या प्रत्येक प्रश्न के साथ संलग्न है।\n`;
        text += `👉 इस पोस्ट को Save करें और अपने सभी ग्रुप्स में शेयर करें!\n\n`;
        text += `#ExamPreparation #GKQuiz #IndianPolity #UPSC #SSC #StateExams`;

        document.getElementById('fb-caption-box').innerText = text;
    }

    function copyPostCaption() {
        navigator.clipboard.writeText(document.getElementById('fb-caption-box').innerText).then(() => {
            alert("📋 फेसबुक कैप्शन कॉपी हो गया!");
        });
    }

    function downloadCurrentSheet() {
        const link = document.createElement('a');
        link.download = `ExamPrep_Feed_Page_${currentPageIndex + 1}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.96);
        link.click();
    }

    function downloadAllSheets() {
        if (compiledPages.length === 0) return;
        let originalIdx = currentPageIndex;
        compiledPages.forEach((pg, idx) => {
            currentPageIndex = idx;
            renderCurrentPage();
            const link = document.createElement('a');
            link.download = `ExamPrep_Feed_Page_${idx + 1}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.96);
            link.click();
        });
        currentPageIndex = originalIdx;
        renderCurrentPage();
    }

    async function shareCurrentSheet() {
        const caption = document.getElementById('fb-caption-box').innerText;
        canvas.toBlob(async (blob) => {
            if (!blob) return;
            const file = new File([blob], `Quiz_Sheet_P${currentPageIndex + 1}.jpg`, { type: 'image/jpeg' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ title: "Exam Preparation Sheet", text: caption, files: [file] });
                } catch (err) {}
            } else {
                downloadCurrentSheet();
                copyPostCaption();
                alert("इमेज डाउनलोड हो गई और कैप्शन कॉपी हुआ। फेसबुक पर पोस्ट करें!");
            }
        }, 'image/jpeg', 0.96);
    }

    window.onload = function() {
        const bank = getQuestionsBank();
        document.getElementById('total-saved-count').innerText = bank.length;
        updatePageEstimate();
    };
</script>
