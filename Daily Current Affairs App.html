<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EP Image Studio - Next-Gen Hub</title>
    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700;800&family=Poppins:wght@700;800;900&family=Rozha+One&family=Tiro+Devanagari+Hindi:ital@0;1&family=Yatra+One&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-color: #0b1329;
            --card-bg: #1e293b;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Noto Sans Devanagari', sans-serif; 
            background: var(--bg-color); 
            padding: 14px; 
            color: #f8fafc; 
            display: flex;
            justify-content: center;
        }
        
        .app-container { 
            width: 100%;
            max-width: 860px; 
            background: var(--card-bg); 
            border-radius: 14px; 
            padding: 16px; 
            border: 1px solid #334155;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            text-align: center;
            padding: 12px 10px;
            border-radius: 10px;
            font-size: 19px;
            font-weight: 800;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.5px;
        }

        .group-box { 
            background: #0f172a; 
            padding: 12px 14px; 
            border-radius: 10px; 
            border: 1px solid #334155; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        
        .row { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            flex-wrap: wrap; 
        }
        
        .row > div { 
            flex: 1; 
            min-width: 170px; 
        }
        
        label { 
            font-weight: 700; 
            display: block; 
            margin-bottom: 4px; 
            font-size: 12px; 
            color: #94a3b8; 
        }
        
        select, input[type="text"], input[type="number"], input[type="file"], textarea { 
            width: 100%; 
            padding: 8px 10px; 
            background: #1e293b;
            border: 1px solid #475569; 
            border-radius: 7px; 
            font-size: 13px; 
            color: #ffffff;
            font-family: inherit;
            outline: none;
        }
        textarea { 
            min-height: 150px; 
            line-height: 1.45; 
            font-family: inherit;
            resize: vertical; 
        }

        .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e293b;
            padding: 8px 10px;
            border-radius: 7px;
            border: 1px solid #475569;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            color: #facc15;
        }
        .checkbox-wrap input {
            width: 16px;
            height: 16px;
            accent-color: #ec4899;
        }

        .slider-wrap {
            background: #1e293b;
            padding: 6px 10px;
            border-radius: 7px;
            border: 1px solid #475569;
        }
        .slider-wrap span { font-size: 11px; float: right; color: #38bdf8; font-weight: bold; }

        .image-status-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .img-badge {
            background: #1e293b;
            border: 1px solid #475569;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            color: #94a3b8;
        }
        .img-badge.active {
            border-color: #10b981;
            color: #34d399;
        }
        .btn-clear-all {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
        }
        .btn-grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
        }
        .btn-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .btn-action { 
            background: linear-gradient(135deg, #0284c7, #2563eb); 
            color: white; 
            border: none; 
            padding: 10px 12px; 
            font-size: 13px; 
            font-weight: 800; 
            border-radius: 8px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
            transition: 0.2s;
        }
        .btn-action:hover { opacity: 0.92; }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-green { background: #10b981; }
        .btn-purple { background: linear-gradient(135deg, #8b5cf6, #6366f1); }
        .btn-amber { background: #d97706; }
        .btn-reset { background: #475569; border: 1px solid #64748b; }
        .btn-mega { background: linear-gradient(135deg, #ec4899, #f43f5e); }

        .preview-box {
            background: #000;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #38bdf8;
            overflow: hidden;
            position: relative;
        }
        canvas { 
            display: block; 
            margin: 0 auto; 
            max-width: 100%; 
            height: auto; 
            border-radius: 6px; 
        }

        .slide-nav {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }
        .slide-nav button {
            background: #1e293b;
            border: 1px solid #38bdf8;
            color: #38bdf8;
            padding: 5px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .caption-card {
            background: #0f172a;
            border: 1.5px solid #0284c7;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .caption-text {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            font-size: 13px;
            line-height: 1.5;
            color: #e2e8f0;
            white-space: pre-wrap;
            user-select: text;
        }

        .status-toast {
            display: none;
            background: #ec4899;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }

        /* MODAL DIALOGS */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-content {
            background: #1e293b;
            border: 1.5px solid #38bdf8;
            border-radius: 12px;
            width: 100%;
            max-width: 680px;
            max-height: 88vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        .archive-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }
        .archive-item {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .item-btns {
            display: flex;
            gap: 6px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">⚡ EP Image Studio - Next-Gen FB Growth Hub</div>

    <!-- 1. MEGA HUB: ARCHIVE, BULK EXPORT & BACKUP -->
    <div class="group-box" style="border: 1.5px solid #ec4899; background: #180d24;">
        <label style="color: #f472b6; font-size: 13px;">👑 Sunday & Monthly Hub: आर्काइव, बल्क एक्सपोर्ट व JSON बैकअप</label>
        <div class="btn-grid-4">
            <button class="btn-action btn-mega" onclick="openArchiveModal()">
                <span>📚 प्रश्न आर्काइव व Edit</span>
            </button>
            <button class="btn-action btn-green" onclick="exportBulkDOC()">
                <span>📄 Export Word (DOC)</span>
            </button>
            <button class="btn-action btn-purple" onclick="exportBulkPDF()">
                <span>🖨️ Export / Print PDF</span>
            </button>
            <button class="btn-action" style="background:#0284c7;" onclick="exportWeeklyCaption()">
                <span>📝 Auto FB Caption</span>
            </button>
        </div>
        <div class="row" style="margin-top: 4px;">
            <div>
                <button class="btn-action btn-amber" style="width:100%; padding: 6px;" onclick="exportArchiveJSON()">
                    <span>💾 Device पर बैकअप लें (Export JSON)</span>
                </button>
            </div>
            <div>
                <button class="btn-action btn-reset" style="width:100%; padding: 6px;" onclick="document.getElementById('jsonFileInput').click()">
                    <span>📥 बैकअप रीस्टोर करें (Import JSON)</span>
                </button>
                <input type="file" id="jsonFileInput" accept=".json" style="display:none;" onchange="importArchiveJSON(event)">
            </div>
        </div>
    </div>

    <!-- 2. STYLE, MODE & GROWTH HOOKS -->
    <div class="group-box">
        <label style="color: #38bdf8;">🚀 पोस्ट मोड, थीम और ग्रोथ सेटिंग्स:</label>
        <div class="row">
            <div>
                <label>📲 पोस्ट फ़ॉर्मेट (Single vs Carousel):</label>
                <select id="postModeSelect" onchange="onModeChange()">
                    <option value="single10" selected>🖼️ 1-Image Mode (सभी 10 प्रश्न एक साथ)</option>
                    <option value="carousel5">🎠 5-Slide Carousel Mode (हर स्लाइड में 2 बड़े प्रश्न)</option>
                </select>
            </div>
            <div>
                <label>विज़ुअल थीम:</label>
                <select id="gridThemeSelect" onchange="applySelectedTheme()">
                    <option value="whiteTheme" selected>⚪ 1. White Clean Theme</option>
                    <option value="instaTheme">📸 2. Instagram Pink Theme</option>
                    <option value="fbTheme">📘 3. Facebook Royal Blue Theme</option>
                    <option value="darkTheme">🖤 4. Modern Dark Neon Theme</option>
                    <option value="navyGoldTheme">👑 5. Royal Navy & Gold Theme</option>
                </select>
            </div>
            <div>
                <label>🔤 हिंदी फ़ॉन्ट स्टाइल:</label>
                <select id="hindiFontSelect" onchange="savePrefsAndRefresh()">
                    <option value="'Noto Sans Devanagari', sans-serif" selected>📱 साफ बोल्ड (Noto Sans)</option>
                    <option value="'Kalam', cursive">✏️ हस्तलिखित नोट्स (Kalam)</option>
                    <option value="'Tiro Devanagari Hindi', serif">🏛️ क्लासिक अखबारी (Tiro)</option>
                    <option value="'Yatra One', cursive">🎯 ट्रेडिशनल बोल्ड (Yatra One)</option>
                </select>
            </div>
            <div>
                <label>📐 QA लेआउट (1-Image Mode):</label>
                <select id="gridLineLayout" onchange="savePrefsAndRefresh()">
                    <option value="doubleLine" selected>⬇️ 2-Line Pill Mode (संतुलित स्पेस)</option>
                    <option value="singleLine">➡️ Single Line Mode (आमने-सामने QA)</option>
                </select>
            </div>
        </div>

        <div class="row" style="margin-top: 4px;">
            <div class="slider-wrap">
                <label>📏 Question Size: <span id="qSizeVal">21px</span></label>
                <input type="range" id="qSizeInput" min="16" max="28" value="21" oninput="document.getElementById('qSizeVal').innerText=this.value+'px'; savePrefsAndRefresh();">
            </div>
            <div class="slider-wrap">
                <label>📏 Answer Size: <span id="aSizeVal">21px</span></label>
                <input type="range" id="aSizeInput" min="16" max="28" value="21" oninput="document.getElementById('aSizeVal').innerText=this.value+'px'; savePrefsAndRefresh();">
            </div>
            <div class="slider-wrap">
                <label>👁️ वॉटरमार्क डार्कनेस: <span id="wmVal">3%</span></label>
                <input type="range" id="watermarkOpacity" min="0.01" max="0.10" step="0.01" value="0.03" oninput="document.getElementById('wmVal').innerText=Math.round(this.value*100)+'%'; savePrefsAndRefresh();">
            </div>
        </div>

        <div class="row" style="margin-top: 4px;">
            <label class="checkbox-wrap" style="flex:1;">
                <input type="checkbox" id="hideLastAnsCheck" onchange="savePrefsAndRefresh()">
                <span>🔥 Comment Hook: Q10 का उत्तर छिपाएं ("उत्तर: ???") ताकि लोग कमेंट करें</span>
            </label>
        </div>
    </div>

    <!-- 3. MULTI-IMAGE UPLOADER -->
    <div class="group-box" style="border-color: #f59e0b;">
        <label style="color: #facc15;">📸 1-Click Multi-Image Uploader (1, 2 या 3 फोटो एक साथ चुनें):</label>
        <div class="row">
            <div style="flex: 2;">
                <input type="file" id="multiImgInput" accept="image/*" multiple onchange="handleMultiImageUpload(event)">
            </div>
            <div style="flex: 0.5; min-width: 100px;">
                <button class="btn-clear-all" style="width:100%; padding:9px;" onclick="clearAllImages()">🗑️ सभी फोटो हटाएं</button>
            </div>
        </div>
        <div class="image-status-bar">
            <div id="badge-slot-1" class="img-badge">Slot 1 (Q1-Q2): खाली</div>
            <div id="badge-slot-2" class="img-badge">Slot 2 (Q5-Q6): खाली</div>
            <div id="badge-slot-3" class="img-badge">Slot 3 (Q9-Q10): खाली</div>
        </div>
    </div>

    <!-- 4. HEADER & STATIC GK FOOTER -->
    <div class="group-box">
        <label style="color: #38bdf8;">🧠 हेडर एवं Static GK फुटर:</label>
        <div class="row">
            <div>
                <label>✍️ मुख्य टाइटल (ऑटो तारीख या Weekly Title):</label>
                <input type="text" id="gridHeaderInput" value="" oninput="debouncedRefresh()">
            </div>
            <div>
                <label>📅 डेट कैप्सूल टेक्स्ट:</label>
                <input type="text" id="gridDateInput" value="Daily Current Affairs" oninput="debouncedRefresh()">
            </div>
        </div>

        <div class="row">
            <div style="flex: 2;">
                <label>❓ आज का सवाल (Footer Static GK):</label>
                <input type="text" id="footerQuestionInput" value="भारत का सबसे ऊँचा जलप्रपात किस राज्य में है? (A) कर्नाटक (B) मेघालय" oninput="onFooterQuestionChange()">
            </div>
            <div style="flex: 0.6; min-width: 120px;">
                <label>&nbsp;</label>
                <button class="btn-action btn-amber" style="padding: 9px; font-size: 12px; width: 100%;" onclick="pickRandomGKQuestion()">🎲 नया सवाल बदलें</button>
            </div>
        </div>
    </div>

    <!-- 5. DATA SHEET & ACTION BUTTONS -->
    <div class="group-box">
        <label style="color: #34d399;">📝 10 प्रश्न-उत्तर इनपुट बॉक्स (Line 1: Q, Line 2: Ans | टैग के लिए [UPPSC] या [SSC] लिखें):</label>
        <textarea id="qaInput" oninput="savePrefsAndRefresh()">[UPPSC] विश्व सेप्सिस दिवस कब मनाया जाता है?
13 सितंबर
अंतरिक्ष शिखर सम्मेलन कहाँ आयोजित हुआ है?
पेरिस
[SSC] DRDO ने माइक्रोवेव रक्षा परीक्षण के लिए कौन-सा कार्यक्रम शुरू किया है?
SHIELD
कारगिल की पहली महिला सैन्य अधिकारी कौन बनी हैं?
स्टैनजिंग त्यांगयांग
ग्लोबल ड्राईलैंड कांग्रेस 2026 का उद्घाटन कहाँ किया गया है?
नई दिल्ली
किसकी आत्मकथा 'अपराजिता' का विमोचन किया गया है?
अरुंधति भट्टाचार्य
[DEFENCE] भारतीय नौसेना ने किस देश के साथ 'समुद्र लक्ष्मण' अभ्यास शुरू किया है?
मलेशिया
दुनिया का पहला कृत्रिम ऊर्जा द्वीप कहाँ स्थित है?
बेल्जियम
[ISRO] ISRO ने किस देश की एजेंसी CNES के साथ 'TRISHNA' मिशन के लिए समझौता किया है?
फ्रांस
भारत-रूस अंतर्राष्ट्रीय औद्योगिक व्यापार मेला कहाँ आयोजित किया गया है?
नई दिल्ली</textarea>
        
        <div class="btn-grid-3">
            <button class="btn-action btn-purple" onclick="pasteFromClipboard()">
                <span>📋 1-Click Paste</span>
            </button>
            <button class="btn-action" onclick="generateQA(true)">
                <span>🔄 Refresh Preview</span>
            </button>
            <button class="btn-action btn-reset" onclick="resetForNewDay()">
                <span>🧹 New Day Reset</span>
            </button>
        </div>
    </div>

    <div id="statusToast" class="status-toast"></div>

    <!-- 6. LIVE PREVIEW CANVAS -->
    <div class="preview-box">
        <canvas id="canvas"></canvas>
        <div class="slide-nav" id="carouselNav">
            <button onclick="changeSlide(-1)">⬅️ पिछली स्लाइड</button>
            <span id="slideIndicator" style="color:#facc15; font-weight:bold; font-size:13px;">Slide 1 / 5</span>
            <button onclick="changeSlide(1)">अगली स्लाइड ➡️</button>
        </div>
    </div>

    <!-- 7. ACTIONS: DOWNLOAD, CAROUSEL, REEL & SHARE -->
    <div class="btn-grid-2">
        <button class="btn-action btn-green" id="primaryDownloadBtn" onclick="handlePrimaryDownload()">
            <span>📥 Download HD PNG (Auto-Saved)</span>
        </button>
        <button class="btn-action btn-mega" id="reelExportBtn" onclick="exportAutoReelVideo()">
            <span>🎬 Export 15-Sec Reel Video</span>
        </button>
    </div>
    <div class="btn-grid-3">
        <button class="btn-action btn-amber" onclick="downloadImageHD('jpeg')">
            <span>🖼️ Download JPEG</span>
        </button>
        <button class="btn-action" style="background:#0284c7;" onclick="shareDirectly()">
            <span>📲 Direct Share</span>
        </button>
        <button class="btn-action btn-purple" onclick="saveToDailyArchiveManual()">
            <span>💾 Save to Archive</span>
        </button>
    </div>

    <!-- 8. AUTO-GENERATED FB CAPTION -->
    <div class="caption-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight: 800; color: #38bdf8; font-size: 13px;">📝 Facebook Auto Caption:</span>
            <button class="btn-action" style="padding: 5px 12px; font-size: 12px;" onclick="copyCaption()">📋 Copy Caption</button>
        </div>
        <div class="caption-text" id="captionDisplay">कैप्शन तैयार हो रहा है...</div>
    </div>
</div>

<!-- ARCHIVE & EDIT MODAL -->
<div id="archiveModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="color:#38bdf8; font-size: 16px;">📚 सहेजा गया प्रश्न आर्काइव (Edit / Delete / Load)</h3>
            <button onclick="closeArchiveModal()" style="background:transparent; border:none; color:white; font-size:18px; cursor:pointer;">✕</button>
        </div>
        <div class="row">
            <button class="btn-action btn-mega" style="font-size:12px; padding:8px;" onclick="loadLast7DaysWeekly()">
                ⚡ मर्ज करें: पिछले 7 दिन (70 प्रश्न एक साथ)
            </button>
            <button class="btn-action" style="font-size:12px; padding:8px; background:#ef4444;" onclick="clearArchiveHistory()">
                🗑️ पूरा आर्काइव साफ़ करें
            </button>
        </div>
        <div class="archive-list" id="archiveItemsList"></div>
    </div>
</div>

<!-- EDIT ITEM MODAL -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="color:#38bdf8; font-size: 16px;">✏️ प्रश्न-उत्तर एडिट करें</h3>
            <button onclick="closeEditModal()" style="background:transparent; border:none; color:white; font-size:18px; cursor:pointer;">✕</button>
        </div>
        <div>
            <label>तारीख / शीर्षक:</label>
            <input type="text" id="editDateInput">
        </div>
        <div>
            <label>प्रश्न-उत्तर:</label>
            <textarea id="editTextarea" style="min-height:220px;"></textarea>
        </div>
        <div class="row">
            <button class="btn-action btn-green" onclick="saveEditedArchiveItem()">💾 बदलाव सुरक्षित करें</button>
            <button class="btn-action btn-reset" onclick="closeEditModal()">रद्द करें</button>

    function handleMultiImageUpload(event) {
        const files = Array.from(event.target.files).slice(0, 3);
        if (files.length === 0) return;

        gridImages = { 1: null, 2: null, 3: null };
        let loadedCount = 0;

        files.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    gridImages[index + 1] = img;
                    loadedCount++;
                    if (loadedCount === files.length) {
                        updateImageBadges();
                        debouncedRefresh();
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    function updateImageBadges() {
        for (let i = 1; i <= 3; i++) {
            const el = document.getElementById(`badge-slot-${i}`);
            const slotName = i === 1 ? "Slot 1 (Q1-Q2)" : (i === 2 ? "Slot 2 (Q5-Q6)" : "Slot 3 (Q9-Q10)");
            if (gridImages[i]) {
                el.innerText = `✅ ${slotName}: सेट`;
                el.classList.add('active');
            } else {
                el.innerText = `${slotName}: खाली`;
                el.classList.remove('active');
            }
        }

    function saveToDailyArchive(dateStr, qaRawText) {
        if (!qaRawText || qaRawText.trim().length < 10) return;
        let archive = getArchive();
        archive = archive.filter(item => item.date !== dateStr);
        archive.unshift({
            date: dateStr,
            text: qaRawText.trim(),
            timestamp: new Date().getTime()
        });
        if (archive.length > 90) archive.pop();
        setArchive(archive);
    }

        }
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(archive, null, 2));
        const a = document.createElement('a');
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `EP_CurrentAffairs_Backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(a);
        a.click();
        a.remove();
    }

    function importArchiveJSON(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (Array.isArray(imported)) {
                    let existing = getArchive();
                    imported.forEach(imp => {
                        existing = existing.filter(x => x.date !== imp.date);
                        existing.unshift(imp);
                    });
                    setArchive(existing);
                    showToast("✅ बैकअप सफलतापूर्वक रीस्टोर हो गया!");
                    openArchiveModal();
                } else {
                    alert("अमान्य बैकअप फ़ाइल!");
                }
            } catch(err) {
                alert("JSON फ़ाइल पढ़ने में त्रुटि हुई।");
            } finally {
                event.target.value = '';
            }
        };
        reader.readAsText(file);
    }

            for (let i = 0; i < lines.length; i += 2) {
                let parsed = parseQuestionWithTag(lines[i]);
                let a = cleanAnswerText(lines[i+1]);
                if (parsed.q) {
                    let tagPrefix = parsed.tag ? `[${parsed.tag}] ` : '';
                    docContent += `<div class="qa-item"><div class="q">Q${count}. ${tagPrefix}${parsed.q}</div><div class="a">उत्तर: ${a}</div></div>`;
                    count++;
                }
            }
        });

        docContent += `</body></html>`;

        const blob = new Blob(['\ufeff' + docContent], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ExamPreparation_CurrentAffairs_Digest.doc`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    }

    // Extracts optional [TAG] like [UPPSC] or [SSC]
    function parseQuestionWithTag(rawQ) {
        if (!rawQ) return { tag: "", q: "" };
        let clean = rawQ.replace(/^(?:[Qqप्र\.]*\s*\d+[\.\:\-\)]*|\d+[\.\:\-\)]*)\s*/, '').trim();
        let tag = "";
        const tagMatch = clean.match(/^\[([^\]]+)\]\s*(.*)/);
        if (tagMatch) {
            tag = tagMatch[1].trim().toUpperCase();
            clean = tagMatch[2].trim();
        }
        clean = clean.replace(/\s*[\.\s]+\?+\s*$/, '?').trim();
        if (clean && !clean.endsWith('?') && !clean.endsWith('।') && !clean.endsWith('.')) {
            clean += '?';
        }
        return { tag, q: clean };
    }

    function cleanAnswerText(rawA) {
        if (!rawA) return "";
        return rawA.replace(/^(?:Ans|उत्तर|Answer)\s*[:\-]\s*/i, '').trim();
    }

    function getParsedItems() {
        const inputData = document.getElementById('qaInput').value.trim();
        const hideLast = document.getElementById('hideLastAnsCheck').checked;
        const lines = inputData.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
        let parsedItems = [];
        for (let i = 0; i < lines.length; i += 2) {
            let parsed = lines[i] ? parseQuestionWithTag(lines[i]) : { tag: "", q: "" };
            let a = lines[i + 1] ? cleanAnswerText(lines[i + 1]) : "";
            if (parsed.q) parsedItems.push({ tag: parsed.tag, q: parsed.q, a });
        }
        const top10 = parsedItems.slice(0, 10);
        if (hideLast && top10.length === 10) {
            top10[9].a = "??? (कमेंट में बताएं 👇)";
            top10[9].isHidden = true;
        }
        return top10;
    }

    function drawOverCardWatermark(ctx, canvas, opacity) {
        ctx.save();
        const theme = THEMES[currentThemeKey];
        ctx.fillStyle = `${theme.wmColor}${opacity})`;
        ctx.font = "900 68px 'Poppins', sans-serif"; 
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(-28 * Math.PI / 180);

        for (let y = -1400; y <= 1400; y += 210) {
            for (let x = -1200; x <= 1200; x += 620) {
                ctx.fillText("EXAM PREPARATION", x, y);
            }
        }
        ctx.restore();
    }

    function drawCoverImage(ctx, img, x, y, w, h, radius) {
        ctx.save();
        roundRect(ctx, x, y, w, h, radius, false, false);
        ctx.clip();

        const imgRatio = img.width / img.height;
        const targetRatio = w / h;
        let sw = img.width;
        let sh = img.height;
        let sx = 0;
        let sy = 0;

        if (imgRatio > targetRatio) {
            sw = img.height * targetRatio;
            sx = (img.width - sw) / 2;
        } else {
            sh = img.width / targetRatio;
            sy = (img.height - sh) / 2;
        }

        ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
        ctx.restore();

        ctx.strokeStyle = "rgba(15, 76, 129, 0.35)";
        ctx.lineWidth = 2.5;
        roundRect(ctx, x, y, w, h, radius, false, true);
    }

    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        if (fill) ctx.fill();
        if (stroke) ctx.stroke();
    }

    function drawExamTagBadge(ctx, tag, x, y, fontSize) {
        if (!tag) return 0;
        ctx.save();
        ctx.font = `800 ${Math.max(12, fontSize - 6)}px 'Poppins', sans-serif`;
        const w = ctx.measureText(tag).width + 14;
        const h = fontSize + 2;
        ctx.fillStyle = "#f59e0b";
        roundRect(ctx, x, y - 2, w, h, 5, true, false);
        ctx.fillStyle = "#0f172a";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(tag, x + w / 2, y - 2 + h / 2);
        ctx.restore();
        return w + 8;
    }

    function drawSmartHighlightedLine(ctx, text, startX, y, theme, defaultColor, isLastLine, maxWidth = 9999) {
        const words = text.split(' ').filter(w => w.length > 0);
        let curX = startX;
        const maxX = startX + maxWidth;

        for (let idx = 0; idx < words.length; idx++) {
            const word = words[idx];
            const clean = word.replace(/[?,.!"'।:]/g, '');
            const isEndWord = isLastLine && (idx === words.length - 1);
            const isKeyword = HIGHLIGHT_TOKENS.some(t => clean === t || clean.includes(t)) || 
                              word.startsWith("'") || word.startsWith('"') || word.includes("'") || word.includes('"');

            const wWidth = ctx.measureText(word + " ").width;
            if (curX + wWidth > maxX && idx > 0) {
                ctx.fillStyle = defaultColor;
                ctx.fillText("...", curX, y);
                break;
            }

            ctx.fillStyle = (isEndWord || isKeyword) ? theme.qHighlightColor : defaultColor;
            ctx.fillText(word + " ", curX, y);
            curX += wWidth;
        }
    }

    function drawAnswerPill(ctx, ansText, textStartX, pillY, baseASize, hindiFont, theme, isHidden = false) {
        ctx.save();
        ctx.font = `800 ${baseASize}px ${hindiFont}`;
        const prefix = "उत्तर: ";
        const totalText = prefix + ansText;
        const textW = ctx.measureText(totalText).width;
        const pillHeight = baseASize + 10;
        const pillWidth = textW + 24;

        ctx.fillStyle = isHidden ? "#fef08a" : theme.pillBg;
        ctx.strokeStyle = isHidden ? "#eab308" : theme.pillBorder;
        ctx.lineWidth = 1.4;
        roundRect(ctx, textStartX, pillY, pillWidth, pillHeight, pillHeight / 2, true, true);

        ctx.fillStyle = isHidden ? "#b91c1c" : theme.aColor;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(totalText, textStartX + 12, pillY + (pillHeight / 2));
        ctx.restore();
    }

    function renderBalancedQA(ctx, item, textStartX, currentY, actualBoxHeight, textAvailWidth, baseQSize, baseASize, hindiFont, theme) {
        ctx.font = `700 ${baseQSize}px ${hindiFont}`;
        ctx.textBaseline = "top";
        
        let tagOffset = item.tag ? drawExamTagBadge(ctx, item.tag, textStartX, currentY + 11, baseQSize) : 0;
        let firstLineAvail = textAvailWidth - tagOffset;

        const words = item.q.split(' ');
        let lines = [];
        let curLine = '';

        for (let n = 0; n < words.length; n++) {
            let test = curLine + words[n] + ' ';
            let limitW = lines.length === 0 ? firstLineAvail : textAvailWidth;
            if (ctx.measureText(test).width > limitW && n > 0) {
                lines.push(curLine.trim());
                curLine = words[n] + ' ';
                if (lines.length === 2) break;
            } else {
                curLine = test;
            }
        }
        if (curLine.trim() && lines.length < 2) {
            lines.push(curLine.trim());
        }

        ctx.textAlign = "left";

        if (lines.length <= 1) {
            ctx.font = `700 ${baseQSize}px ${hindiFont}`;
            drawSmartHighlightedLine(ctx, item.q, textStartX + tagOffset, currentY + 14, theme, theme.qColor, true, firstLineAvail);

            const pillY = currentY + actualBoxHeight - baseASize - 16;
            drawAnswerPill(ctx, item.a, textStartX, pillY, baseASize, hindiFont, theme, item.isHidden);
        } else {
            const lineGap = baseQSize + 4;
            ctx.font = `700 ${baseQSize}px ${hindiFont}`;
            drawSmartHighlightedLine(ctx, lines[0], textStartX + tagOffset, currentY + 9, theme, theme.qColor, false, firstLineAvail);
            drawSmartHighlightedLine(ctx, lines[1], textStartX, currentY + 9 + lineGap, theme, theme.qColor, true, textAvailWidth);

            const pillY = currentY + actualBoxHeight - baseASize - 13;
            drawAnswerPill(ctx, item.a, textStartX, pillY, baseASize, hindiFont, theme, item.isHidden);
        }
    }

    // Renders a single Carousel Slide (2 Big Questions per slide)
    function renderCarouselSlide(ctx, canvas, items, slideIndex) {
        const theme = THEMES[currentThemeKey];
        const hindiFont = document.getElementById('hindiFontSelect').value;
        const wmOpacity = parseFloat(document.getElementById('watermarkOpacity').value) || 0.03;

        drawHeaderAndFooter(ctx, canvas, theme, `Swipe Card ${slideIndex + 1} of 5 • Daily GK`);

        const startIdx = slideIndex * 2;
        const slideItems = items.slice(startIdx, startIdx + 2);
        const startY = 205;
        const cardH = 490;
        const gap = 30;

        slideItems.forEach((item, localIdx) => {
            const qNum = startIdx + localIdx + 1;
            const y = startY + localIdx * (cardH + gap);

            ctx.save();
            ctx.fillStyle = theme.cardBg;
            ctx.strokeStyle = theme.pillBorder;
            ctx.lineWidth = 2.5;
            roundRect(ctx, 55, y, 970, cardH, 22, true, true);
            ctx.restore();

            // Number Badge
            ctx.save();
            ctx.fillStyle = theme.badgeBg;
            ctx.beginPath();
            ctx.arc(115, y + 60, 34, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.font = "800 28px 'Poppins', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(qNum, 115, y + 61);
            ctx.restore();

            // Optional Tag
            let tagX = 170;
            if (item.tag) {
                drawExamTagBadge(ctx, item.tag, tagX, y + 42, 26);
            }

            // Big Wrapped Question (up to 4 lines)
            const bigQSize = 36;
            ctx.font = `700 ${bigQSize}px ${hindiFont}`;
            ctx.textAlign = "left";
            ctx.textBaseline = "top";
            const maxW = 890;
            const words = item.q.split(' ');
            let qLines = [];
            let cur = '';
            words.forEach(w => {
                if (ctx.measureText(cur + w + ' ').width > maxW && cur.length > 0) {
                    qLines.push(cur.trim());
                    cur = w + ' ';
                } else {
                    cur += w + ' ';
                }
            });
            if (cur.trim()) qLines.push(cur.trim());

            qLines.slice(0, 4).forEach((line, lIdx) => {
                drawSmartHighlightedLine(ctx, line, 95, y + 125 + (lIdx * 52), theme, theme.qColor, lIdx === qLines.length - 1, maxW);
            });

            // Big Answer Pill at bottom of card
            drawAnswerPill(ctx, item.a, 95, y + cardH - 85, 34, hindiFont, theme, item.isHidden);
        });

        drawOverCardWatermark(ctx, canvas, wmOpacity);
    }

    async function generateQA(isPreviewOnly) {
        const mode = document.getElementById('postModeSelect').value;
        const theme = THEMES[currentThemeKey];
        const hindiFont = document.getElementById('hindiFontSelect').value;
        const lineLayout = document.getElementById('gridLineLayout').value;
        const wmOpacity = parseFloat(document.getElementById('watermarkOpacity').value) || 0.03;
        
        const qFontSize = parseInt(document.getElementById('qSizeInput').value) || 21;
        const aFontSize = parseInt(document.getElementById('aSizeInput').value) || 21;
        const parsedItems = getParsedItems();

        const canvas = document.getElementById('canvas'); 
        canvas.width = 1080; 
        canvas.height = 1350;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (mode === 'carousel5') {
            renderCarouselSlide(ctx, canvas, parsedItems, currentSlideIdx);
            return;
        }

        // Standard 10-Question Single Image Mode
        drawHeaderAndFooter(ctx, canvas, theme);

        const startTopOffset = 70;
        const startY = startTopOffset + 115; 
        const footerHeight = 65;
        const availableHeight = canvas.height - startY - footerHeight - 15;
        const rowHeight = Math.floor(availableHeight / 10);
        const actualBoxHeight = rowHeight - 9;

        // Timeline Line
        if (!gridImages[2]) {
            const firstBadgeCenterY = startY + (actualBoxHeight / 2) + 3;
            const lastBadgeCenterY = startY + (9 * rowHeight) + (actualBoxHeight / 2) + 3;
            ctx.save();
            ctx.strokeStyle = theme.timelineColor;
            ctx.lineWidth = 3.5;
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(45 + 42, firstBadgeCenterY);
            ctx.lineTo(45 + 42, lastBadgeCenterY);
            ctx.stroke();
            ctx.restore();
        }

        parsedItems.forEach((item, idx) => {
            let currentY = startY + (idx * rowHeight);
            let boxX = 45; 
            let boxWidth = 990;
            if ((idx === 0 || idx === 1) && gridImages[1]) boxWidth = 785;
            else if ((idx === 4 || idx === 5) && gridImages[2]) { boxX = 250; boxWidth = 785; }
            else if ((idx === 8 || idx === 9) && gridImages[3]) boxWidth = 785;

            ctx.save(); 
            ctx.fillStyle = theme.cardBg; 
            ctx.strokeStyle = "rgba(15, 76, 129, 0.20)";
            ctx.lineWidth = 1.5;
            roundRect(ctx, boxX, currentY + 3, boxWidth, actualBoxHeight, 14, true, true);
            ctx.restore();
        });

        // Draw Images
        const imgWidth = 195;
        const imgHeight = (rowHeight * 2) - 9;
        if (gridImages[1]) drawCoverImage(ctx, gridImages[1], 840, startY + 3, imgWidth, imgHeight, 14);
        if (gridImages[2]) drawCoverImage(ctx, gridImages[2], 45, startY + (4 * rowHeight) + 3, imgWidth, imgHeight, 14);
        if (gridImages[3]) drawCoverImage(ctx, gridImages[3], 840, startY + (8 * rowHeight) + 3, imgWidth, imgHeight, 14);

        // Watermark
        drawOverCardWatermark(ctx, canvas, wmOpacity);

        // Numbers and QA Text
        parsedItems.forEach((item, idx) => {
            let currentY = startY + (idx * rowHeight);
            let displayNum = idx + 1;

            let boxX = 45; 
            let boxWidth = 990;
            if ((idx === 0 || idx === 1) && gridImages[1]) boxWidth = 785;
            else if ((idx === 4 || idx === 5) && gridImages[2]) { boxX = 250; boxWidth = 785; }
            else if ((idx === 8 || idx === 9) && gridImages[3]) boxWidth = 785;

            let badgeRadius = 24;
            let badgeX = boxX + 42;
            let badgeY = currentY + (actualBoxHeight / 2) + 3;

            ctx.save(); 
            ctx.shadowColor = "rgba(0,0,0,0.25)";
            ctx.shadowBlur = 6;
            ctx.fillStyle = theme.badgeBg;
            ctx.beginPath(); 
            ctx.arc(badgeX, badgeY, badgeRadius, 0, Math.PI * 2); 
            ctx.fill();
            ctx.restore();
            
            ctx.save();
            ctx.fillStyle = "#ffffff"; 
            ctx.font = "800 20px 'Poppins', sans-serif"; 
            ctx.textAlign = "center"; 
            ctx.textBaseline = "middle";
            ctx.fillText(displayNum, badgeX, badgeY + 1); 
            ctx.restore();

            let textStartX = boxX + 85;

            if (lineLayout === 'singleLine') {
                ctx.save();
                ctx.font = `800 ${aFontSize}px ${hindiFont}`;
                const ansText = "उत्तर: " + item.a;
                const textW = ctx.measureText(ansText).width;
                const pillH = aFontSize + 10;
                const pillW = textW + 22;
                const pillX = boxX + boxWidth - pillW - 16;
                const pillY = currentY + (actualBoxHeight / 2) - (pillH / 2) + 2;

                let tagOffset = item.tag ? drawExamTagBadge(ctx, item.tag, textStartX, currentY + (actualBoxHeight / 2) - 8, qFontSize) : 0;
                let maxQWidth = (pillX - 15) - (textStartX + tagOffset);

                ctx.font = `700 ${qFontSize}px ${hindiFont}`; 
                ctx.textAlign = "left"; 
                ctx.textBaseline = "middle";
                drawSmartHighlightedLine(ctx, item.q, textStartX + tagOffset, currentY + (actualBoxHeight / 2) + 2, theme, theme.qColor, true, maxQWidth);

                ctx.fillStyle = item.isHidden ? "#fef08a" : theme.pillBg;
                ctx.strokeStyle = item.isHidden ? "#eab308" : theme.pillBorder;
                ctx.lineWidth = 1.2;
                roundRect(ctx, pillX, pillY, pillW, pillH, pillH / 2, true, true);

                ctx.fillStyle = item.isHidden ? "#b91c1c" : theme.aColor;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(ansText, pillX + (pillW / 2), pillY + (pillH / 2));
                ctx.restore();
            } else {
                let textAvailWidth = boxWidth - 100;
                renderBalancedQA(ctx, item, textStartX, currentY + 3, actualBoxHeight, textAvailWidth, qFontSize, aFontSize, hindiFont, theme);
            }
        });
    }

    function handlePrimaryDownload() {
        const mode = document.getElementById('postModeSelect').value;
        if (mode === 'carousel5') {
            downloadAll5CarouselSlides();
        } else {
            downloadImageHD('png');
        }
    }

    function downloadAll5CarouselSlides() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const parsedItems = getParsedItems();
        const headerDate = (document.getElementById('gridHeaderInput').value || getAutoFormattedDate()).replace(/\s+/g, '_');
        
        saveToDailyArchive(document.getElementById('gridHeaderInput').value || getAutoFormattedDate(), document.getElementById('qaInput').value);

        for (let i = 0; i < 5; i++) {
            setTimeout(() => {
                renderCarouselSlide(ctx, canvas, parsedItems, i);
                const link = document.createElement('a');
                link.download = `CA_${headerDate}_Slide_${i + 1}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                if (i === 4) {
                    setTimeout(() => generateQA(true), 300);
                    showToast("✅ सभी 5 Carousel स्लाइड्स डाउनलोड हो गई हैं!");
                }
            }, i * 350);
        }
    }

    function downloadImageHD(format = 'png') {
        const canvas = document.getElementById('canvas');
        const headerDate = (document.getElementById('gridHeaderInput').value || getAutoFormattedDate()).replace(/\s+/g, '_');
        const rawText = document.getElementById('qaInput').value;

        saveToDailyArchive(document.getElementById('gridHeaderInput').value || getAutoFormattedDate(), rawText);

        const link = document.createElement('a');
        if (format === 'jpeg') {
            link.download = `Current_Affairs_${headerDate}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.95);
        } else {
            link.download = `Current_Affairs_${headerDate}.png`;
            link.href = canvas.toDataURL('image/png');
        }
        link.click();
        showToast("📥 इमेज डाउनलोड और आर्काइव में सेव हो गई!");
    }

    // Exports a 15-Second Animated Video (WebM) cycling through all 5 Carousel Slides
    function exportAutoReelVideo() {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const parsedItems = getParsedItems();
        const headerDate = (document.getElementById('gridHeaderInput').value || getAutoFormattedDate()).replace(/\s+/g, '_');
        const btn = document.getElementById('reelExportBtn');

        if (!canvas.captureStream || typeof MediaRecorder === 'undefined') {
            alert("आपका ब्राउज़र डायरेक्ट वीडियो रिकॉर्डिंग सपोर्ट नहीं करता। कृपया Chrome का उपयोग करें।");
            return;
        }

        btn.disabled = true;
        showToast("🎬 रील वीडियो तैयार हो रहा है (15 सेकंड प्रतीक्षा करें)...", 0);

        const stream = canvas.captureStream(30);
        const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        const chunks = [];

        recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Current_Affairs_Reel_${headerDate}.webm`;
            a.click();
            URL.revokeObjectURL(url);
            btn.disabled = false;
            generateQA(true);
            showToast("✅ 15-सेकंड रील वीडियो डाउनलोड हो गया!");
        };

        recorder.start();
        let slide = 0;
        renderCarouselSlide(ctx, canvas, parsedItems, slide);

        const interval = setInterval(() => {
            slide++;
            if (slide < 5) {
                renderCarouselSlide(ctx, canvas, parsedItems, slide);
            } else {
                clearInterval(interval);
                recorder.stop();
            }
        }, 3000); // 3 seconds per slide * 5 slides = 15 seconds
    }

    async function shareDirectly() {
        const canvas = document.getElementById('canvas');
        const caption = document.getElementById('captionDisplay').innerText;
        canvas.toBlob(async (blob) => {
            if (!blob) return;
            const file = new File([blob], `Daily_Current_Affairs.png`, { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ title: `Daily Current Affairs`, text: caption, files: [file] });
                } catch(e) {}
            } else {
                downloadImageHD('png');
                copyCaption();
                alert("डायरेक्ट शेयर समर्थित नहीं है। फ़ोटो डाउनलोड और कैप्शन कॉपी कर दिया गया है!");
            }
        });
    }

    window.onload = function() {
        loadSavedPrefs();
        document.getElementById('gridHeaderInput').value = getAutoFormattedDate();
        if (!document.getElementById('footerQuestionInput').value) {
            pickRandomGKQuestion();
        }
        updateCaption();
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => { generateQA(true); });
        } else {
            generateQA(true);
        }
    };
</script>
