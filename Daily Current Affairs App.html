            gap: 10px; 
        }

        .row > div { 
            flex: 1; 
            min-width: 180px; 
        }
        
        label {

            display: block; 
            margin-bottom: 4px; 
            font-size: 12px; 
            color: #94a3b8; 
        }
        
        select, input[type="text"], input[type="number"], textarea {

            padding: 9px 12px; 
            background: #1e293b;
            border: 1px solid #475569; 
            border-radius: 7px; 
            font-size: 13px; 
            color: #ffffff;
            font-family: inherit;

    const THEMES = {

            headerColor: '#881337',
            dateBg: '#e11d48',
            badgeBg: '#e11d48',
            qColor: '#1e293b',
            aColor: '#be123c',
            footerBg: '#881337',
            footerText: '#fef08a'
        },
        fbTheme: {
            bg: '#eff6ff',
            cardBg: 'rgba(255, 255, 255, 0.97)',
            headerColor: '#1e3a8a',

            badgeBg: '#1d4ed8',

        },
        darkTheme: {
            bg: '#090d16',
            cardBg: 'rgba(30, 41, 59, 0.95)',
            headerColor: '#38bdf8',

            badgeBg: '#0284c7',
            qColor: '#f8fafc',

    let currentThemeKey = 'whiteTheme';
    let debounceTimer = null;

    function getAutoFormattedDate() {
        const today = new Date();
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        return `${today.getDate()} ${months[today.getMonth()]} ${today.getFullYear()}`;
    }

    }

        document.getElementById('footerQuestionInput').value = randQ;

    function updateCaption() {
        const headerDate = document.getElementById('gridHeaderInput').value || getAutoFormattedDate();
        const footerQ = document.getElementById('footerQuestionInput').value;

        const caption = `🔥 Daily Current Affairs - ${headerDate} 🇮🇳
━━━━━━━━━━━━━━━━━━━━━━━
📌 आज के शीर्ष 10 महत्वपूर्ण प्रश्न-उत्तर ऊपर दिए गए हैं। सभी प्रतियोगी परीक्षाओं (SSC, UP Police, Railway, State Exams) के लिए अति महत्वपूर्ण!

🧠 आज का सवाल:
👉 "${footerQ}"

.
.
#CurrentAffairs #DailyCurrentAffairs #ExamPreparation #GKQuiz #SamanyaGyan #StudyMotivation`;

        document.getElementById('captionDisplay').innerText = caption;
    }

    function copyCaption() {
        const cap = document.getElementById('captionDisplay').innerText;
        navigator.clipboard.writeText(cap).then(() => {
            alert("📋 फेसबुक कैप्शन कॉपी हो गया है!");

    async function pasteFromClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            if (text && text.trim().length > 0) {
                document.getElementById('qaInput').value = text;
                debouncedRefresh();
            } else {
                alert("क्लिपबोर्ड खाली है!");
            }
        } catch(e) {
            alert("क्लिपबोर्ड अनुमति नहीं मिली। कृपया बॉक्स में सीधे पेस्ट करें।");
        }
    }

    function debouncedRefresh() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            generateQA(true);
            updateCaption();
        }, 100);
    }

    // Strip leading numbering like 1., Q.1, प्र. 1 etc.
    function cleanQuestionText(rawQ) {
        if (!rawQ) return "";
        return rawQ.replace(/^(?:[Qqप्र\.]*\s*\d+[\.\:\-\)]*|\d+[\.\:\-\)]*)\s*/, '').trim();
    }

    function cleanAnswerText(rawA) {
        if (!rawA) return "";
        return rawA.replace(/^(?:Ans|उत्तर|Answer)\s*[:\-]\s*/i, '').trim();
    }

    function drawDiagonalWatermark(ctx, canvas) {
        ctx.save();
        ctx.fillStyle = (currentThemeKey === 'darkTheme' || currentThemeKey === 'navyGoldTheme') 
            ? "rgba(255, 255, 255, 0.025)" 
            : "rgba(0, 0, 0, 0.035)";
        ctx.font = "900 60px 'Poppins', sans-serif"; 
        ctx.textAlign = "center";
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(-Math.PI / 5);

        for (let y = -1200; y <= 1200; y += 220) {
            for (let x = -1000; x <= 1000; x += 650) {
                ctx.fillText("EXAM PREPARATION", x, y);
            }
        }
        ctx.restore();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 2) {
        if (!text) return y;
        const words = text.toString().split(' ');
        let currentLine = ''; 
        let renderY = y;
        let lineCount = 1;

        for (let n = 0; n < words.length; n++) {
            let testLine = currentLine + words[n] + ' ';
            if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                if (lineCount >= maxLines) {
                    currentLine = currentLine.trim() + '...';
                    break;
                }
                ctx.fillText(currentLine.trim(), x, renderY);
                currentLine = words[n] + ' '; 
                renderY += lineHeight;
                lineCount++;
            } else { 
                currentLine = testLine; 
            }
        }
        ctx.fillText(currentLine.trim(), x, renderY); 
        return renderY;
    }

    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        if (fill) ctx.fill();
        if (stroke) ctx.stroke();
    }

    async function generateQA(isPreviewOnly) {
        const theme = THEMES[currentThemeKey];
        const inputData = document.getElementById('qaInput').value.trim();
        const startNum = parseInt(document.getElementById('gridStartNumInput').value) || 1;
        const lineLayout = document.getElementById('gridLineLayout').value;
        const aspectRatio = document.getElementById('gridAspectRatio').value;

        const rawData = inputData || `1. किस राज्य में स्थित जलालाबाद का नाम बदलकर परशुरामपुरी किया गया है?
उत्तर प्रदेश

2. नेमार किस खेल के प्रसिद्ध खिलाड़ी हैं जिन्होंने संन्यास लिया?
फुटबॉल

3. विश्व जल दिवस प्रतिवर्ष किस तिथि को मनाया जाता है?
22 मार्च

4. 69वें फिल्मफेयर पुरस्कार में सर्वश्रेष्ठ फिल्म का पुरस्कार किसे मिला?
12th Fail

5. इसरो का सूर्य मिशन 'आदित्य-L1' किस बिंदु पर स्थापित हुआ है?

7. हाल ही में 'भारत रत्न' 2024 से सम्मानित कर्पूरी ठाकुर किस राज्य के पूर्व मुख्यमंत्री थे?

8. खेलो इंडिया यूथ गेम्स 2024 में कौन सा राज्य पदक तालिका में शीर्ष पर रहा?

9. 16वें वित्त आयोग के अध्यक्ष के रूप में किन्हें नियुक्त किया गया है?
डॉ. अरविंद पनगढ़िया

10. दुनिया का सबसे बड़ा सौर ऊर्जा पार्क भारत के किस राज्य में स्थित है?
राजस्थान (भडला सोलर पार्क)`;

        const blocks = rawData.split(/\n\s*\n/).map(b => b.trim()).filter(b => b !== '');
        let parsedItems = [];
        blocks.forEach(block => {
            let lines = block.split('\n').map(l => l.trim()).filter(l => l !== '');
            if (lines.length >= 2) { 
                parsedItems.push({ q: cleanQuestionText(lines[0]), a: cleanAnswerText(lines[1]) }); 
            } else if (lines.length === 1) { 
                parsedItems.push({ q: cleanQuestionText(lines[0]), a: "" }); 
            }
        });

        const canvas = document.getElementById('canvas'); 
        canvas.width = 1080; 
        canvas.height = aspectRatio === '9:16' ? 1920 : 1350;

        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Canvas Background
        ctx.fillStyle = theme.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawDiagonalWatermark(ctx, canvas);

        // Header Title
        const headerTitle = document.getElementById('gridHeaderInput').value || getAutoFormattedDate();
        const startTopOffset = aspectRatio === '9:16' ? 110 : 70;
        
        ctx.fillStyle = theme.headerColor; 
        ctx.font = `700 70px "Rozha One", sans-serif`; 
        ctx.textAlign = "center";
        ctx.fillText(headerTitle, canvas.width / 2, startTopOffset);

        // Date Capsule Badge
        const dateText = document.getElementById('gridDateInput').value || "Daily Current Affairs";
        ctx.save(); 
        ctx.fillStyle = theme.dateBg;
        let textWidth = ctx.measureText(dateText).width + 60;
        if (textWidth < 260) textWidth = 260;
        
        ctx.fillStyle = theme.dateBg;
        roundRect(ctx, canvas.width / 2 - (textWidth / 2), startTopOffset + 15, textWidth, 42, 21, true, false);
        
        ctx.fillStyle = "#ffffff"; 
        ctx.font = `700 24px 'Poppins', sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(dateText, canvas.width / 2, startTopOffset + 15 + 21); 
        ctx.restore();

        // Ribbon & Part Badge (Exam Preparation)
        const ribbonY = startTopOffset + 82;
        ctx.save();
        ctx.fillStyle = theme.headerColor;
        ctx.font = "800 20px 'Poppins', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("UPPSC || SSC || RAILWAY || UP POLICE || BPSC || ALL EXAMS", canvas.width / 2 - 75, ribbonY);

        // Exam Preparation Badge
        const partText = "Exam Preparation";
        const partW = 180;
        ctx.fillStyle = theme.dateBg;
        roundRect(ctx, canvas.width / 2 + 250, ribbonY - 18, partW, 30, 8, true, false);
        ctx.fillStyle = "#ffffff";
        ctx.font = "800 15px 'Poppins', sans-serif";
        ctx.textBaseline = "middle";
        ctx.fillText(partText, canvas.width / 2 + 250 + (partW / 2), ribbonY - 3);
        ctx.restore();

        // 10 QA Cards Area Calculation
        const startY = startTopOffset + 115; 
        const footerHeight = 65;
        const availableHeight = canvas.height - startY - footerHeight - 15;
        const rowHeight = Math.floor(availableHeight / 10);
        const actualBoxHeight = rowHeight - 9;

        parsedItems.slice(0, 10).forEach((item, idx) => {
            let currentY = startY + (idx * rowHeight);
            let displayNum = startNum + idx;

            let boxX = 45; 
            let boxWidth = 990;

            // Box Container
            ctx.save(); 
            ctx.fillStyle = theme.cardBg; 
            ctx.strokeStyle = "rgba(15, 76, 129, 0.20)";
            ctx.lineWidth = 1.5;
            roundRect(ctx, boxX, currentY + 3, boxWidth, actualBoxHeight, 14, true, true);
            ctx.restore();

            // Number Circle Badge
            let badgeRadius = 24;
            let badgeX = boxX + 42;
            let badgeY = currentY + (rowHeight / 2) - 1;

            ctx.save(); 
            ctx.fillStyle = theme.badgeBg;
            ctx.beginPath(); 
            ctx.arc(badgeX, badgeY, badgeRadius, 0, Math.PI * 2); 
            ctx.fill();
            
            ctx.fillStyle = "#ffffff"; 
            ctx.font = "800 20px 'Poppins', sans-serif"; 
            ctx.textAlign = "center"; 
            ctx.textBaseline = "middle";
            ctx.fillText(displayNum, badgeX, badgeY + 1); 
            ctx.restore();

            let textStartX = boxX + 85;

            if (lineLayout === 'singleLine') {
                let textAvailWidth = boxWidth - 320;
                ctx.save(); 
                ctx.fillStyle = theme.qColor; 
                ctx.font = `700 24px 'Noto Sans Devanagari', sans-serif`; 
                ctx.textAlign = "left"; 
                ctx.textBaseline = "middle";
                ctx.fillText(item.q, textStartX, currentY + (rowHeight / 2) - 2); 
                ctx.restore();

                ctx.save(); 
                ctx.fillStyle = theme.aColor; 
                ctx.font = `800 25px 'Noto Sans Devanagari', sans-serif`; 
                ctx.textAlign = "right"; 
                ctx.textBaseline = "middle";
                ctx.fillText(item.a, boxX + boxWidth - 25, currentY + (rowHeight / 2) - 2); 
                ctx.restore();
            } else {
                // 2-Line Mode (Safe Padding)
                let textAvailWidth = boxWidth - 110;
                ctx.save(); 
                ctx.fillStyle = theme.qColor; 
                ctx.font = `700 24px 'Noto Sans Devanagari', sans-serif`; 
                ctx.textAlign = "left"; 
                ctx.textBaseline = "top";
                wrapText(ctx, item.q, textStartX, currentY + 14, textAvailWidth, 27, 1); 
                ctx.restore();

                ctx.save(); 
                ctx.fillStyle = theme.aColor; 
                ctx.font = `800 24px 'Noto Sans Devanagari', sans-serif`; 
                ctx.textAlign = "left"; 
                ctx.textBaseline = "bottom";
                ctx.fillText("उत्तर: " + item.a, textStartX, currentY + actualBoxHeight - 8); 
                ctx.restore();
            }
        });

        // 7. FOOTER STRIP WITH STATIC GK ENGAGEMENT QUESTION
        const footerQ = document.getElementById('footerQuestionInput').value;
        const footerFullText = `🧠 आज का सवाल: ${footerQ} (उत्तर कमेंट करें 👇)`;

        ctx.save(); 
        ctx.fillStyle = theme.footerBg; 
        ctx.fillRect(0, canvas.height - footerHeight, canvas.width, footerHeight);
        
        // Gold accent top line
        ctx.fillStyle = "#ffcc00"; 
        ctx.fillRect(0, canvas.height - footerHeight, canvas.width, 3.5);
        
        ctx.fillStyle = theme.footerText; 
        ctx.font = '700 26px "Kalam", cursive'; 
        ctx.textAlign = "center"; 
        ctx.textBaseline = "middle";
        ctx.fillText(footerFullText, canvas.width / 2, canvas.height - (footerHeight / 2) + 2); 
        ctx.restore();
    }

    function downloadImageHD() {
        const headerDate = (document.getElementById('gridHeaderInput').value || getAutoFormattedDate()).replace(/\s+/g, '_');
        const link = document.createElement('a');
        link.download = `Current_Affairs_${headerDate}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    async function shareDirectly() {
        const caption = document.getElementById('captionDisplay').innerText;
        canvas.toBlob(async (blob) => {
            if (!blob) return;
            const file = new File([blob], `Daily_Current_Affairs.png`, { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ title: `Daily Current Affairs`, text: caption, files: [file] });
                } catch(e) {}
            } else {
                downloadImageHD();
                copyCaption();
                alert("डायरेक्ट शेयर समर्थित नहीं है। फ़ोटो डाउनलोड और कैप्शन कॉपी हो गया है!");
            }
        });
    }

    window.onload = function() {
        document.getElementById('gridHeaderInput').value = getAutoFormattedDate();
        pickRandomGKQuestion();
        generateQA(true);
    };
</script>
</body>
</html>
