<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EP Image Studio - 10-in-1 Daily Current Affairs</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Rozha+One&family=Tiro+Devanagari+Hindi:ital@0;1&family=Yatra+One&display=swap');
        
        :root { 
            --primary: #0f4c81; 
            --bg-color: #eef2f5;
            --app-font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body { 
            font-family: var(--app-font); 
            background: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            color: #333; 
        }
        
        .app-container { 
            max-width: 900px; 
            margin: 0 auto; 
            background: white; 
            border-radius: 12px; 
            padding: 25px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
        }

        .header {
            background-color: #000000;
            text-align: center;
            padding: 12px 5px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .header-line1 {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
        }

        .group-box { 
            background: #f8f9fa; 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid #ddd; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            margin-bottom: 15px;
        }
        
        .row { 
            display: flex; 
            gap: 12px; 
            align-items: center; 
            flex-wrap: wrap; 
        }
        
        .row > div { 
            flex: 1; 
            min-width: 200px; 
        }
        
        label { 
            font-weight: bold; 
            display: block; 
            margin-bottom: 6px; 
            font-size: 13px; 
            color: #444; 
        }
        
        select, input[type="text"], input[type="number"], textarea { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-size: 14px; 
            box-sizing: border-box; 
        }

        .color-presets { 
            display: flex; 
            gap: 8px; 
            margin-top: 4px; 
            flex-wrap: wrap; 
        }
        .color-btn { 
            width: 34px; 
            height: 34px; 
            border-radius: 6px; 
            border: 2px solid #ddd; 
            cursor: pointer; 
            transition: 0.15s; 
        }
        .color-btn:hover, .color-btn.active { 
            border-color: #000 !important; 
            transform: scale(1.12); 
            box-shadow: 0 0 6px rgba(0,0,0,0.35);
        }
        
        .slider-item {
            background: white;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }
        .slider-item label { margin-bottom: 2px; }
        .slider-item span { font-size: 12px; float: right; color: #007bff; font-weight: bold; }

        textarea { height: 140px; line-height: 1.5; resize: vertical; }
        
        .btn-action { 
            background: #007bff; color: white; border: none; padding: 15px; 
            font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; 
            width: 100%; transition: 0.2s; 
        }
        .btn-action:hover { background: #0056b3; }

        .preview-box {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
            border: 2px solid #3b82f6;
        }
        .preview-title {
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 16px;
        }
        canvas { 
            display: block; 
            margin: 0 auto; 
            max-width: 100%; 
            height: auto; 
            border-radius: 8px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        #gallery { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; margin-top: 25px; 
        }
        .card { 
            border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; 
            text-align: center; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .card img { width: 100%; border-radius: 6px; margin-bottom: 12px; }
        .card a { display: block; background: var(--primary); color: white; padding: 10px; text-decoration: none; border-radius: 6px; font-weight: bold; }

        @media (max-width: 600px) {
            .app-container { padding: 12px; }
            .row > div { min-width: 100%; }
        }
    </style>
</head>
<body>

<script>
    function getAutoFormattedDate() {
        const today = new Date();
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const day = today.getDate();
        const month = months[today.getMonth()];
        const year = today.getFullYear();
        return `${day} ${month} ${year}`;
    }

    const globalState = {
        gridHeaderColor: '#0a1172',
        gridDateBgColor: '#b71c1c',
        gridBgColor: '#fffde7', // Default to Soft Yellow
        gridQColor: '#0c1a30',
        gridAColor: '#b71c1c'
    };

    let gridImages = { 1: null, 2: null, 3: null };
    let debounceTimer = null;

    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            if (typeof r === 'undefined') r = 5;
            this.beginPath(); this.moveTo(x + r, y);
            this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y); this.arcTo(x, y, x + w, y, r);
            this.closePath(); return this;
        };
    }

    function setStudioColor(type, targetValue, inlineElement) {
        globalState[type] = targetValue;
        const parentContainer = inlineElement.parentElement;
        const targetButtons = parentContainer.getElementsByClassName('color-btn');
        for (let btn of targetButtons) { btn.classList.remove('active'); }
        inlineElement.classList.add('active');
        debouncedRefresh();
    }

    function updateSliderVal(inputId, valId) {
        const val = document.getElementById(inputId).value;
        document.getElementById(valId).innerText = val + 'px';
        debouncedRefresh();
    }

    function debouncedRefresh() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            generateQA(true);
        }, 120);
    }

    function loadGridImages(imgIndex) {
        const file = document.getElementById(`gridImgFile${imgIndex}`).files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image(); 
                img.onload = function() { 
                    gridImages[imgIndex] = img; 
                    generateQA(true); 
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    async function ensureFontsLoaded() {
        if (!document.fonts || !document.fonts.load) return;
        try {
            await Promise.all([
                document.fonts.load('700 32px "Kalam"'),
                document.fonts.load('400 32px "Kalam"'),
                document.fonts.load('700 32px "Noto Sans Devanagari"'),
                document.fonts.load('700 32px "Tiro Devanagari Hindi"'),
                document.fonts.load('700 32px "Rozha One"'),
                document.fonts.load('700 32px "Yatra One"')
            ]);
            await document.fonts.ready;
        } catch (e) {}
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        if (!text) return y;
        const words = text.toString().split(' ');
        let currentLine = ''; let renderY = y;
        for (let n = 0; n < words.length; n++) {
            let testLine = currentLine + words[n] + ' ';
            if (ctx.measureText(testLine).width > maxWidth && n > 0) {
                ctx.fillText(currentLine.trim(), x, renderY);
                currentLine = words[n] + ' '; renderY += lineHeight;
            } else { currentLine = testLine; }
        }
        ctx.fillText(currentLine.trim(), x, renderY); return renderY;
    }

    function drawDiagonalWatermark(ctx, canvas, opacity) {
        ctx.save();
        ctx.fillStyle = opacity || "rgba(0, 0, 0, 0.035)";
        ctx.font = "900 65px Arial, sans-serif"; 
        ctx.textAlign = "center";
        
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(-Math.PI / 5);

        for (let y = -1200; y <= 1200; y += 220) {
            for (let x = -1000; x <= 1000; x += 650) {
                ctx.fillText("Exam Preparation", x, y);
            }
        }
        ctx.restore();
    }

    async function generateQA(isPreviewOnly) {
        const inputData = document.getElementById('qaInput').value.trim();
        if (!isPreviewOnly) document.getElementById('gallery').innerHTML = '';
        await ensureFontsLoaded();

        const startNum = parseInt(document.getElementById('gridStartNumInput').value) || 1;
        const lineLayout = document.getElementById('gridLineLayout').value;
        const selectedFont = document.getElementById('gridFontSelect').value || "Noto Sans Devanagari";
        let activeFontFamily = selectedFont === 'Kalam' ? '"Kalam", cursive' : `"${selectedFont}", sans-serif`;

        const rawData = inputData || "किस राज्य में स्थित जलालाबाद का नाम बदलकर परशुरामपुरी किया गया है?\nउत्तर प्रदेश\n\nनेमार किस खेल के प्रसिद्ध खिलाड़ी हैं?\nफुटबॉल";
        const blocks = rawData.split(/\n\s*\n/).map(b => b.trim()).filter(b => b !== '');
        let parsedItems = [];
        blocks.forEach(block => {
            let lines = block.split('\n').map(l => l.trim()).filter(l => l !== '');
            if (lines.length >= 2) { parsedItems.push({ q: lines[0], a: lines[1] }); }
            else if (lines.length === 1) { parsedItems.push({ q: lines[0], a: "" }); }
        });

        const canvas = document.getElementById('canvas'); 
        canvas.width = 1080; 
        const aspectRatio = document.getElementById('gridAspectRatio').value;
        canvas.height = aspectRatio === '9:16' ? 1920 : 1350;

        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const bgVal = globalState.gridBgColor;
        if (!bgVal.startsWith('grad')) {
            ctx.fillStyle = bgVal; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else {
            let gradientObj = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            if(bgVal === 'gradSunset') { gradientObj.addColorStop(0, '#ff7e5f'); gradientObj.addColorStop(1, '#feb47b'); }
            else if(bgVal === 'gradOcean') { gradientObj.addColorStop(0, '#2b5876'); gradientObj.addColorStop(1, '#4e4376'); }
            ctx.fillStyle = gradientObj; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        drawDiagonalWatermark(ctx, canvas, "rgba(0,0,0,0.035)");

        const headerTitle = document.getElementById('gridHeaderInput').value || getAutoFormattedDate();
        const headerSize = document.getElementById('gridHeaderSizeInput').value || 70;
        const startTopOffset = aspectRatio === '9:16' ? 120 : 75;
        
        ctx.fillStyle = globalState.gridHeaderColor; 
        ctx.font = `700 ${headerSize}px "Rozha One", sans-serif`; 
        ctx.textAlign = "center";
        ctx.fillText(headerTitle, canvas.width / 2, startTopOffset);

        // DATE CAPSULE BADGE
        const dateText = document.getElementById('gridDateInput').value;
        const dateFontSize = document.getElementById('gridDateSizeInput').value || 24;
        
        ctx.save(); 
        ctx.fillStyle = globalState.gridDateBgColor || "#b71c1c";
        ctx.font = `700 ${dateFontSize}px sans-serif`;
        let textWidth = ctx.measureText(dateText).width + 50;
        if (textWidth < 220) textWidth = 220;
        
        ctx.beginPath();
        ctx.roundRect(canvas.width / 2 - (textWidth / 2), startTopOffset + 15, textWidth, parseInt(dateFontSize) + 22, (parseInt(dateFontSize) + 22) / 2); 
        ctx.fill();
        ctx.fillStyle = "#ffffff"; 
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(dateText, canvas.width / 2, startTopOffset + 15 + ((parseInt(dateFontSize) + 22) / 2)); 
        ctx.restore();

        // STRAIGHT RIBBON & PART BADGE
        const ribbonText = document.getElementById('gridRibbonInput').value;
        const partText = document.getElementById('gridPartInput').value || "";
        
        if (ribbonText.trim() !== "") {
            ctx.save(); 
            ctx.fillStyle = globalState.gridDateBgColor; 
            ctx.font = "700 20px Arial, sans-serif"; 
            
            if (partText.trim() !== "") {
                ctx.textAlign = "center";
                ctx.fillText(ribbonText, canvas.width / 2 - 50, startTopOffset + 90);

                let partWidth = ctx.measureText(partText).width + 24;
                ctx.fillStyle = globalState.gridDateBgColor;
                ctx.beginPath();
                ctx.roundRect(canvas.width / 2 + 300, startTopOffset + 68, partWidth, 32, 8); 
                ctx.fill();
                ctx.fillStyle = "#ffffff"; 
                ctx.font = "bold 16px Arial"; 
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(partText, canvas.width / 2 + 300 + (partWidth/2), startTopOffset + 84);
            } else {
                ctx.textAlign = "center";
                ctx.fillText(ribbonText, canvas.width / 2, startTopOffset + 90);
            }
            ctx.restore();
        }

        const startY = startTopOffset + 110; 
        const footerHeight = 55;
        const availableHeight = canvas.height - startY - footerHeight - 15;
        const rowHeight = Math.floor(availableHeight / 10);
        const actualBoxHeight = rowHeight - 10;

        const qSizeVal = document.getElementById('gridQSizeInput').value || 25;
        const aSizeVal = document.getElementById('gridASizeInput').value || 27;

        parsedItems.slice(0, 10).forEach((item, idx) => {
            let currentY = startY + (idx * rowHeight);
            let displayNum = startNum + idx;

            let badgeRadius = displayNum >= 100 ? 28 : 24;
            let leftMarginPadding = displayNum >= 100 ? 115 : 100;

            let boxX = 45; let boxWidth = 990;
            if ((idx === 0 || idx === 1) && gridImages[1]) boxWidth = 790;
            else if ((idx === 4 || idx === 5) && gridImages[2]) { boxX = 245; boxWidth = 790; }
            else if ((idx === 8 || idx === 9) && gridImages[3]) boxWidth = 790;

            ctx.save(); 
            ctx.fillStyle = "rgba(255, 255, 255, 0.95)"; 
            ctx.strokeStyle = "rgba(15, 76, 129, 0.25)";
            ctx.beginPath();
            ctx.roundRect(boxX, currentY + 5, boxWidth, actualBoxHeight, 12); 
            ctx.fill(); 
            ctx.stroke(); 
            ctx.restore();

            let badgeX = boxX + (badgeRadius + 18);
            ctx.save(); 
            ctx.fillStyle = globalState.gridDateBgColor || "#b71c1c";
            ctx.beginPath(); 
            ctx.arc(badgeX, currentY + (rowHeight / 2), badgeRadius, 0, Math.PI * 2); 
            ctx.fill();
            
            ctx.fillStyle = "#ffffff"; 
            ctx.font = displayNum >= 100 ? "700 17px Arial" : "700 20px Arial"; 
            ctx.textAlign = "center"; 
            ctx.textBaseline = "middle";
            ctx.fillText(displayNum, badgeX, currentY + (rowHeight / 2)); 
            ctx.restore();

            let textStartX = boxX + leftMarginPadding;

            if (lineLayout === 'singleLine') {
                let textAvailWidth = boxWidth - leftMarginPadding - 210;
                ctx.save(); 
                ctx.fillStyle = globalState.gridQColor; 
                ctx.font = `700 ${qSizeVal}px ${activeFontFamily}`; 
                ctx.textAlign = "left"; 
                ctx.textBaseline = "middle";
                wrapText(ctx, item.q, textStartX, currentY + (rowHeight / 2) - 4, textAvailWidth, parseInt(qSizeVal) + 5); 
                ctx.restore();

                ctx.save(); 
                ctx.fillStyle = globalState.gridAColor; 
                ctx.font = `700 ${aSizeVal}px ${activeFontFamily}`; 
                ctx.textAlign = "left"; 
                ctx.textBaseline = "middle";
                wrapText(ctx, item.a, boxX + boxWidth - 195, currentY + (rowHeight / 2) - 4, 185, parseInt(aSizeVal) + 5); 
                ctx.restore();
            } else if (lineLayout === 'doubleLine') {
                let textAvailWidth = boxWidth - leftMarginPadding - 30;
                ctx.save(); 
                ctx.fillStyle = globalState.gridQColor; 
                ctx.font = `700 ${qSizeVal}px ${activeFontFamily}`; 
                ctx.textAlign = "left"; 
                ctx.textBaseline = "top";
                wrapText(ctx, item.q, textStartX, currentY + 16, textAvailWidth, parseInt(qSizeVal) + 4); 
                ctx.restore();

                ctx.save(); 
                ctx.fillStyle = globalState.gridAColor; 
                ctx.font = `700 ${aSizeVal}px ${activeFontFamily}`; 
                ctx.textAlign = "left"; 
                ctx.textBaseline = "bottom";
                ctx.fillText("उत्तर: " + item.a, textStartX, currentY + rowHeight - 16); 
                ctx.restore();
            }
        });

        if (gridImages[1]) {
            let imgY = startY + 5; let imgH = (rowHeight * 2) - 10;
            ctx.save(); ctx.beginPath(); ctx.roundRect(840, imgY, 190, imgH, 12); ctx.clip();
            ctx.drawImage(gridImages[1], 840, imgY, 190, imgH); ctx.restore();
        }
        if (gridImages[2]) {
            let imgY = startY + (4 * rowHeight) + 5; let imgH = (rowHeight * 2) - 10;
            ctx.save(); ctx.beginPath(); ctx.roundRect(45, imgY, 190, imgH, 12); ctx.clip();
            ctx.drawImage(gridImages[2], 45, imgY, 190, imgH); ctx.restore();
        }
        if (gridImages[3]) {
            let imgY = startY + (8 * rowHeight) + 5; let imgH = (rowHeight * 2) - 10;
            ctx.save(); ctx.beginPath(); ctx.roundRect(840, imgY, 190, imgH, 12); ctx.clip();
            ctx.drawImage(gridImages[3], 840, imgY, 190, imgH); ctx.restore();
        }

        const footerText = document.getElementById('gridFooterTextInput').value;
        ctx.save(); 
        ctx.fillStyle = "#0c1a30"; 
        ctx.fillRect(0, canvas.height - footerHeight, canvas.width, footerHeight);
        ctx.fillStyle = "#ffcc00"; 
        ctx.fillRect(0, canvas.height - footerHeight, canvas.width, 3);
        ctx.fillStyle = "#ffffff"; 
        ctx.font = 'italic 700 28px "Kalam", cursive'; 
        ctx.textAlign = "center"; 
        ctx.textBaseline = "middle";
        ctx.fillText(footerText, canvas.width / 2, canvas.height - (footerHeight / 2) + 1); 
        ctx.restore();

        if (!isPreviewOnly) pushGallery(canvas.toDataURL('image/jpeg'), `Grid_Sheet_Post.jpg`);
    }

    function pushGallery(data, name) {
        const gal = document.getElementById('gallery');
        gal.innerHTML += `
            <div class="card">
                <img src="${data}">
                <div class="btn-container">
                    <a href="${data}" download="${name}">⬇️ Download Post Image</a>
                </div>
            </div>`;
    }

    window.onload = function() {
        document.getElementById('gridHeaderInput').value = getAutoFormattedDate();
        generateQA(true);
    };
</script>
</body>
</html>
