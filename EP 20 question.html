<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EP 20 Question Sheet Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@600;700;800&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Hind', sans-serif;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .header-title {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #38bdf8;
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
            font-family: 'Poppins', sans-serif;
        }

        /* AI CONTROL PANEL */
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-title {
            font-size: 13px;
            font-weight: 800;
            color: #c084fc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input, select {
            flex: 1;
            padding: 9px 12px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            outline: none;
        }

        input[type="range"] {
            padding: 0;
            cursor: pointer;
            accent-color: #38bdf8;
        }

        /* SUBJECT SELECTOR BUTTONS (H, G, P) */
        .subject-grid {
            display: flex;
            gap: 8px;
        }
        .btn-subject {
            flex: 1;
            padding: 10px;
            background: #0f172a;
            border: 2px solid #475569;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn-subject.active {
            border-color: #38bdf8;
            background: #0284c7;
            color: white;
            box-shadow: 0 0 12px rgba(2, 132, 199, 0.4);
        }

        .btn-generate {
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-generate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* CANVAS PREVIEW */
        .canvas-container {
            width: 100%;
            background: #000000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .btn-download {
            background: #10b981;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
        }

        /* FB CAPTION BOX */
        .caption-card {
            background: #1e293b;
            border: 1.5px dashed #38bdf8;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .caption-text {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            line-height: 1.5;
            color: #e2e8f0;
            min-height: 80px;
            white-space: pre-wrap;
            user-select: text;
        }
        .btn-copy {
            background: #0284c7;
            color: white;
            border: none;
            padding: 9px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        /* HISTORY ARCHIVE CARD */
        .history-card {
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .history-list {
            max-height: 280px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }
        .history-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .history-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }
        .history-badge {
            background: #0284c7;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 800;
            font-family: 'Poppins', sans-serif;
            font-size: 11px;
        }
        .history-title {
            font-size: 13px;
            font-weight: 700;
            color: #e2e8f0;
            line-height: 1.35;
        }
        .history-actions {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }
        .btn-hist {
            flex: 1;
            border: none;
            padding: 6px 8px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
        }
        .btn-hist-load { background: #0284c7; color: white; }
        .btn-hist-down { background: #10b981; color: white; }
        .btn-hist-del { background: #ef4444; color: white; flex: 0 0 35px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">EP 20 Question Study-Sheet AI Studio</div>

    <!-- AI SETUP -->
    <div class="card">
        <div class="card-title">🔑 Google Gemini API Settings</div>
        <input type="password" id="api-key" placeholder="Paste Gemini API Key here..." onchange="saveKey()">

        <div class="card-title" style="margin-top: 4px;">🎯 विषय चुनें (H / G / P)</div>
        <div class="subject-grid">
            <button class="btn-subject active" id="btn-h" onclick="selectSubject('H')">📜 H (इतिहास)</button>
            <button class="btn-subject" id="btn-g" onclick="selectSubject('G')">🌍 G (भूगोल)</button>
            <button class="btn-subject" id="btn-p" onclick="selectSubject('P')">⚖️ P (राजव्यवस्था)</button>
        </div>

        <div class="input-row">
            <label style="font-size: 12px; color: #94a3b8; font-weight: bold;">वर्तमान भाग (Part):</label>
            <input type="number" id="current-part" value="1" min="1" style="max-width: 80px; text-align: center;" onchange="updateRangeDisplay()">
            <span id="range-preview" style="font-size: 12px; color: #38bdf8; font-weight: bold;">प्रश्न: 1 - 20</span>
        </div>

        <!-- FONT SIZE CONTROLLER -->
        <div class="input-row" style="background: #0f172a; padding: 8px 12px; border-radius: 8px; border: 1px solid #334155;">
            <label style="font-size: 12px; color: #94a3b8; font-weight: bold; white-space: nowrap;">प्रश्न फ़ॉन्ट साइज़:</label>
            <input type="range" id="q-font-size" min="16" max="25" value="21" oninput="changeFontSize(this.value)">
            <span id="font-size-val" style="font-size: 13px; color: #38bdf8; font-weight: 800; min-width: 45px; text-align: right;">21px</span>
        </div>

        <button class="btn-generate" id="btn-gen" onclick="generate20Questions()">
            <span>✨ Generate 20 Questions Post (AI)</span>
        </button>
    </div>

    <!-- POSTER CANVAS -->
    <div class="canvas-container">
        <canvas id="posterCanvas" width="1080" height="1350"></canvas>
    </div>

    <button class="btn-download" onclick="downloadPosterImage()">📥 Download 1080×1350 Poster Image</button>

    <!-- FB CAPTION CARD -->
    <div class="caption-card">
        <div class="card-title" style="color: #38bdf8;">📝 Facebook Caption & Hashtags (अलग से कॉपी करें)</div>
        <div class="caption-text" id="fb-caption-box">प्रश्नों के जनरेट होते ही यहाँ आपका पोस्ट कैप्शन और हैशटैग अपने आप आ जाएगा...</div>
        <button class="btn-copy" onclick="copyCaptionText()">📋 Copy FB Caption & Hashtags</button>
    </div>

    <!-- SAVED HISTORY ARCHIVE CARD -->
    <div class="history-card">
        <div class="card-title" style="color: #38bdf8;">
            <span>📚 पिछली पोस्ट्स का इतिहास (Saved History Archive)</span>
            <span id="history-count" style="font-size: 11px; color: #94a3b8;">0 पोस्ट्स</span>
        </div>
        <div class="history-list" id="history-list-box"></div>
    </div>
</div>

<script>
    const STORAGE_KEY_API = "GEMINI_API_KEY_LOCAL";
    const STORAGE_KEY_HISTORY = "EP_POSTS_ARCHIVE_DATA_V1";
    let selectedSub = 'H';
    let currentFontSize = 21;
    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');

    let currentData = {
        subject: "H",
        part: 1,
        capsule: "🎯 प्राचीन भारत (भाग 1) : प्रागैतिहासिक काल | टॉपिक: सिन्धु घाटी सभ्यता",
        hook: "🔥 99% अभ्यर्थी इन 20 प्रश्नों में गलतियाँ करते हैं, परीक्षा में पूरे अंक पक्के करने हैं तो अभी रट लो!",
        questions: Array.from({length: 20}, (_, i) => ({
            q: `${i + 1}. सिन्धु सभ्यता का प्रमुख पत्तन नगर (बन्दरगाह) कौन सा था?`,
            a: "लोथल (गुजरात)"
        }))
    };

    function saveKey() {
        const k = document.getElementById('api-key').value.trim();
        if (k) localStorage.setItem(STORAGE_KEY_API, k);
    }

    function selectSubject(code) {
        selectedSub = code;
        document.querySelectorAll('.btn-subject').forEach(b => b.classList.remove('active'));
        if (code === 'H') document.getElementById('btn-h').classList.add('active');
        if (code === 'G') document.getElementById('btn-g').classList.add('active');
        if (code === 'P') document.getElementById('btn-p').classList.add('active');

        const savedPart = localStorage.getItem(`EP_PART_${selectedSub}`) || 1;
        document.getElementById('current-part').value = savedPart;
        updateRangeDisplay();
    }

    function updateRangeDisplay() {
        const part = parseInt(document.getElementById('current-part').value) || 1;
        const start = (part - 1) * 20 + 1;
        const end = part * 20;
        document.getElementById('range-preview').innerText = `प्रश्न: ${start} - ${end}`;
    }

    function changeFontSize(val) {
        currentFontSize = parseInt(val);
        document.getElementById('font-size-val').innerText = `${currentFontSize}px`;
        localStorage.setItem("EP_SAVED_FONT_SIZE", currentFontSize);
        drawPoster();
    }

    async function generate20Questions() {
        let apiKey = document.getElementById('api-key').value.trim() || localStorage.getItem(STORAGE_KEY_API);
        if (!apiKey) {
            alert("कृपया पहले ऊपर Google Gemini API Key डालें!");
            return;
        }

        const part = parseInt(document.getElementById('current-part').value) || 1;
        const startQ = (part - 1) * 20 + 1;
        const endQ = part * 20;

        let subjectName = "इतिहास (History)";
        if (selectedSub === 'G') subjectName = "भूगोल (Geography)";
        if (selectedSub === 'P') subjectName = "भारतीय राजव्यवस्था (Indian Polity)";

        const btn = document.getElementById('btn-gen');
        btn.disabled = true;
        btn.innerHTML = `<span>⏳ 20 प्रश्न तैयार हो रहे हैं...</span>`;

        const prompt = `Act as an expert competitive exam coach.
Generate a high-yield topic-wise set of 20 one-liner Q&A in Hindi for: ${subjectName}.
Part number is ${part}. Numbering must strictly be sequentially from ${startQ} to ${endQ}. No questions repeated.
Output strictly valid raw JSON with this exact structure:
{
  "capsule": "🎯 ${subjectName} (भाग ${part}) : [खंड नाम] | टॉपिक: [सटीक टॉपिक का नाम]",
  "hook": "🔥 99% अभ्यर्थी इन 20 प्रश्नों में गलतियाँ करते हैं, परीक्षा में पूरे अंक पक्के करने हैं तो अभी रट लो!",
  "questions": [
    {"q": "${startQ}. प्रश्न का टेक्स्ट?", "a": "सटीक उत्तर"},
    ... 20 items up to question ${endQ}
  ],
  "caption": "🎯 ${subjectName} (भाग ${part}) के 20 अति-महत्वपूर्ण प्रश्न जो आगामी परीक्षाओं के लिए बेहद खास हैं। पूरा पढ़ें और सुरक्षित सेव कर लें।",
  "hashtags": "#${selectedSub === 'H' ? 'HistoryGK' : selectedSub === 'G' ? 'GeographyGK' : 'PolityGK'} #CompetitiveExams #GKQuiz #ImportantGK #ExamPreparation"
}`;

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error?.message || `HTTP ${res.status}`);
            }

            const data = await res.json();
            let text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
            const jsonMatch = text.match(/\{[\s\S]*\}/);
            if (jsonMatch) text = jsonMatch[0];

            const parsed = JSON.parse(text);

            currentData = {
                subject: selectedSub,
                part: part,
                capsule: parsed.capsule,
                hook: parsed.hook,
                questions: parsed.questions
            };

            const fullCaption = `${parsed.caption}\n\n${parsed.hashtags}`;
            document.getElementById('fb-caption-box').innerText = fullCaption;

            saveToHistoryArchive({
                id: Date.now(),
                date: new Date().toLocaleDateString('hi-IN'),
                subject: selectedSub,
                part: part,
                capsule: parsed.capsule,
                hook: parsed.hook,
                questions: parsed.questions,
                caption: fullCaption
            });

            localStorage.setItem(`EP_PART_${selectedSub}`, part + 1);
            document.getElementById('current-part').value = part + 1;
            updateRangeDisplay();

            drawPoster();
            renderHistoryList();
            alert(`🎉 भाग ${part} के 20 प्रश्न तैयार और हिस्ट्री में सेव हो गए हैं!`);
        } catch (e) {
            alert("त्रुटि: " + e.message);
            console.error(e);
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<span>✨ Generate 20 Questions Post (AI)</span>`;
        }
    }

    /* RENDER 1080 x 1350 POSTER */
    function drawPoster() {
        ctx.clearRect(0, 0, 1080, 1350);

        // Background
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 1080, 1350);

        // Faint Watermark
        ctx.save();
        ctx.rotate(-28 * Math.PI / 180);
        ctx.fillStyle = "rgba(15, 23, 42, 0.035)";
        ctx.font = "900 44px 'Poppins', sans-serif";
        for (let x = -600; x < 1600; x += 360) {
            for (let y = -400; y < 1800; y += 180) {
                ctx.fillText("EXAM PREPARATION", x, y);
            }
        }
        ctx.restore();

        // 1. Top Header Branding
        ctx.fillStyle = "#0284c7";
        ctx.font = "900 40px 'Poppins', sans-serif";
        ctx.fillText("EXAM Preparation", 45, 62);

        ctx.fillStyle = "#e11d48";
        ctx.font = "italic 700 24px 'Hind', sans-serif";
        ctx.fillText("• One-Shot Revision Notes", 465, 62);

        // 2. Topic Red Capsule
        roundRect(ctx, 40, 80, 1000, 64, 32, "#dc2626");
        ctx.fillStyle = "#ffffff";
        ctx.font = "800 28px 'Hind', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(currentData.capsule, 540, 122);

        // 3. Hook Black Ribbon
        roundRect(ctx, 40, 154, 1000, 52, 12, "#111827");
        ctx.fillStyle = "#facc15";
        ctx.font = "800 22px 'Hind', sans-serif";
        ctx.fillText(currentData.hook, 540, 187);
        ctx.textAlign = "left";

        // 4. Two Columns for 20 Questions
        const col1X = 45;
        const col2X = 555;
        const startY = 245;
        const rowGap = 102;
        const maxColWidth = 480;

        currentData.questions.slice(0, 10).forEach((item, i) => {
            drawQuestionBlock(col1X, startY + (i * rowGap), item, maxColWidth);
        });

        currentData.questions.slice(10, 20).forEach((item, i) => {
            drawQuestionBlock(col2X, startY + (i * rowGap), item, maxColWidth);
        });

        // 5. NEW FOOTER CTA (Follow & Share)
        ctx.strokeStyle = "#cbd5e1";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(45, 1270);
        ctx.lineTo(1035, 1270);
        ctx.stroke();

        ctx.fillStyle = "#1e293b";
        ctx.font = "800 22px 'Hind', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🔔 रोजाना ऐसे ही महत्वपूर्ण प्रश्नों के लिए Follow करें और Share करें 👍", 540, 1312);
        ctx.textAlign = "left";
    }

    function drawQuestionBlock(x, y, item, maxW) {
        // Dynamic Question Size
        ctx.fillStyle = "#0f172a";
        ctx.font = `800 ${currentFontSize}px 'Hind', sans-serif`;
        wrapText(ctx, item.q, x, y, maxW, currentFontSize + 4);

        // Scaled Answer Size
        const ansFontSize = Math.max(15, currentFontSize - 0.5);
        ctx.fillStyle = "#dc2626";
        ctx.font = `800 ${ansFontSize}px 'Hind', sans-serif`;
        ctx.fillText(`उत्तर: ${item.a}`, x, y + currentFontSize + 25);
    }

    function roundRect(ctx, x, y, width, height, radius, fill) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        for(let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            let metrics = ctx.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                ctx.fillText(line, x, y);
                line = words[n] + ' ';
                y += lineHeight;
            } else {
                line = testLine;
            }
        }
        ctx.fillText(line, x, y);
    }

    function downloadPosterImage() {
        const link = document.createElement('a');
        link.download = `EP_20Q_${currentData.subject}_Part_${currentData.part}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    function copyCaptionText() {
        const text = document.getElementById('fb-caption-box').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert("📋 फेसबुक कैप्शन और हैशटैग कॉपी हो गए हैं!");
        });
    }

    /* HISTORY ARCHIVE ENGINE */
    function getHistory() {
        try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY)) || [];
        } catch(e) {
            return [];
        }
    }

    function saveToHistoryArchive(item) {
        let history = getHistory();
        history.unshift(item);
        if (history.length > 50) history.pop();
        localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
    }

    function renderHistoryList() {
        const listContainer = document.getElementById('history-list-box');
        const countSpan = document.getElementById('history-count');
        const history = getHistory();

        countSpan.innerText = `${history.length} पोस्ट्स`;

        if (history.length === 0) {
            listContainer.innerHTML = `<div style="text-align:center; color:#64748b; font-size:12px; padding:12px;">अभी कोई पुरानी पोस्ट नहीं है। जैसे ही आप जनरेट करेंगे, वे यहाँ सुरक्षित सेव हो जाएँगी।</div>`;
            return;
        }

        let html = "";
        history.forEach(item => {
            const subName = item.subject === 'H' ? 'इतिहास' : item.subject === 'G' ? 'भूगोल' : 'राजव्यवस्था';
            html += `
                <div class="history-item">
                    <div class="history-meta">
                        <span class="history-badge">${subName} • भाग ${item.part}</span>
                        <span style="color:#64748b; font-size:11px;">📅 ${item.date}</span>
                    </div>
                    <div class="history-title">${escapeHtml(item.capsule)}</div>
                    <div class="history-actions">
                        <button class="btn-hist btn-hist-load" onclick="loadHistoryItem(${item.id})">👁️ View / लोड करें</button>
                        <button class="btn-hist btn-hist-down" onclick="downloadFromHistory(${item.id})">📥 Download</button>
                        <button class="btn-hist btn-hist-del" onclick="deleteHistoryItem(${item.id})" title="Delete">🗑️</button>
                    </div>
                </div>
            `;
        });
        listContainer.innerHTML = html;
    }

    function loadHistoryItem(id) {
        const history = getHistory();
        const item = history.find(x => x.id === id);
        if (!item) return;

        currentData = {
            subject: item.subject,
            part: item.part,
            capsule: item.capsule,
            hook: item.hook,
            questions: item.questions
        };

        document.getElementById('fb-caption-box').innerText = item.caption;
        drawPoster();
        document.querySelector('.canvas-container').scrollIntoView({ behavior: 'smooth' });
        alert(`✅ भाग ${item.part} स्क्रीन पर लोड हो गया है!`);
    }

    function downloadFromHistory(id) {
        loadHistoryItem(id);
        setTimeout(() => {
            downloadPosterImage();
        }, 150);
    }

    function deleteHistoryItem(id) {
        if (confirm("क्या आप इस पोस्ट को इतिहास से हटाना चाहते हैं?")) {
            let history = getHistory();
            history = history.filter(x => x.id !== id);
            localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
            renderHistoryList();
        }
    }

    function escapeHtml(text) {
        return text.replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
        });
    }

    window.onload = function() {
        const k = localStorage.getItem(STORAGE_KEY_API);
        if (k) document.getElementById('api-key').value = k;

        const savedSize = localStorage.getItem("EP_SAVED_FONT_SIZE");
        if (savedSize) {
            currentFontSize = parseInt(savedSize);
            document.getElementById('q-font-size').value = currentFontSize;
            document.getElementById('font-size-val').innerText = `${currentFontSize}px`;
        }

        selectSubject('H');
        drawPoster();
        renderHistoryList();
    };
</script>

</body>
</html>
