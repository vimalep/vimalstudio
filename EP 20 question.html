<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EP 20 Question Sheet Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@600;700;800&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Hind', sans-serif;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .header-title {
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            color: #38bdf8;
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
            font-family: 'Poppins', sans-serif;
        }

        /* AI CONTROL PANEL */
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-title {
            font-size: 13px;
            font-weight: 800;
            color: #c084fc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        input, select {
            flex: 1;
            padding: 9px 12px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            outline: none;
        }

        /* SUBJECT SELECTOR BUTTONS (H, G, P) */
        .subject-grid {
            display: flex;
            gap: 8px;
        }
        .btn-subject {
            flex: 1;
            padding: 10px;
            background: #0f172a;
            border: 2px solid #475569;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn-subject.active {
            border-color: #38bdf8;
            background: #0284c7;
            color: white;
            box-shadow: 0 0 12px rgba(2, 132, 199, 0.4);
        }

        .btn-generate {
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-generate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* CANVAS PREVIEW */
        .canvas-container {
            width: 100%;
            background: #000000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .btn-download {
            background: #10b981;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
        }

        /* FB CAPTION BOX */
        .caption-card {
            background: #1e293b;
            border: 1.5px dashed #38bdf8;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .caption-text {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            line-height: 1.5;
            color: #e2e8f0;
            min-height: 80px;
            white-space: pre-wrap;
            user-select: text;
        }
        .btn-copy {
            background: #0284c7;
            color: white;
            border: none;
            padding: 9px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">EP 20 Question Study-Sheet AI Studio</div>

    <!-- AI SETUP -->
    <div class="card">
        <div class="card-title">🔑 Google Gemini API Settings</div>
        <input type="password" id="api-key" placeholder="Paste Gemini API Key here..." onchange="saveKey()">

        <div class="card-title" style="margin-top: 4px;">🎯 विषय चुनें (H / G / P)</div>
        <div class="subject-grid">
            <button class="btn-subject active" id="btn-h" onclick="selectSubject('H')">📜 H (इतिहास)</button>
            <button class="btn-subject" id="btn-g" onclick="selectSubject('G')">🌍 G (भूगोल)</button>
            <button class="btn-subject" id="btn-p" onclick="selectSubject('P')">⚖️ P (राजव्यवस्था)</button>
        </div>

        <div class="input-row">
            <label style="font-size: 12px; color: #94a3b8; font-weight: bold;">वर्तमान भाग (Part):</label>
            <input type="number" id="current-part" value="1" min="1" style="max-width: 80px; text-align: center;" onchange="updateRangeDisplay()">
            <span id="range-preview" style="font-size: 12px; color: #38bdf8; font-weight: bold;">प्रश्न: 1 - 20</span>
        </div>

        <button class="btn-generate" id="btn-gen" onclick="generate20Questions()">
            <span>✨ Generate 20 Questions Post (AI)</span>
        </button>
    </div>

    <!-- POSTER CANVAS -->
    <div class="canvas-container">
        <canvas id="posterCanvas" width="1080" height="1350"></canvas>
    </div>

    <button class="btn-download" onclick="downloadPosterImage()">📥 Download 1080×1350 Poster Image</button>

    <!-- FB CAPTION CARD -->
    <div class="caption-card">
        <div class="card-title" style="color: #38bdf8;">📝 Facebook Caption & Hashtags (अलग से कॉपी करें)</div>
        <div class="caption-text" id="fb-caption-box">प्रश्नों के जनरेट होते ही यहाँ आपका पोस्ट कैप्शन और हैशटैग अपने आप आ जाएगा...</div>
        <button class="btn-copy" onclick="copyCaptionText()">📋 Copy FB Caption & Hashtags</button>
    </div>
</div>

<script>
    let selectedSub = 'H';
    const canvas = document.getElementById('posterCanvas');
    const ctx = canvas.getContext('2d');

    // Default Demo Data
    let currentData = {
        capsule: "🎯 प्राचीन भारत (भाग 1) : प्रागैतिहासिक काल | टॉपिक: सिन्धु घाटी सभ्यता",
        hook: "🔥 99% अभ्यर्थी इन 20 प्रश्नों में गलतियाँ करते हैं, परीक्षा में पूरे अंक पक्के करने हैं तो अभी रट लो!",
        questions: Array.from({length: 20}, (_, i) => ({
            q: `${i + 1}. सिन्धु सभ्यता का प्रमुख पत्तन नगर (बन्दरगाह) कौन सा था?`,
            a: "लोथल (गुजरात)"
        }))
    };

    function saveKey() {
        const k = document.getElementById('api-key').value.trim();
        if (k) localStorage.setItem("GEMINI_API_KEY_LOCAL", k);
    }

    function selectSubject(code) {
        selectedSub = code;
        document.querySelectorAll('.btn-subject').forEach(b => b.classList.remove('active'));
        if (code === 'H') document.getElementById('btn-h').classList.add('active');
        if (code === 'G') document.getElementById('btn-g').classList.add('active');
        if (code === 'P') document.getElementById('btn-p').classList.add('active');

        // Load saved part for this subject
        const savedPart = localStorage.getItem(`EP_PART_${selectedSub}`) || 1;
        document.getElementById('current-part').value = savedPart;
        updateRangeDisplay();
    }

    function updateRangeDisplay() {
        const part = parseInt(document.getElementById('current-part').value) || 1;
        const start = (part - 1) * 20 + 1;
        const end = part * 20;
        document.getElementById('range-preview').innerText = `प्रश्न: ${start} - ${end}`;
    }

    async function generate20Questions() {
        let apiKey = document.getElementById('api-key').value.trim() || localStorage.getItem("GEMINI_API_KEY_LOCAL");
        if (!apiKey) {
            alert("कृपया पहले ऊपर Google Gemini API Key डालें!");
            return;
        }

        const part = parseInt(document.getElementById('current-part').value) || 1;
        const startQ = (part - 1) * 20 + 1;
        const endQ = part * 20;

        let subjectName = "इतिहास (History)";
        if (selectedSub === 'G') subjectName = "भूगोल (Geography)";
        if (selectedSub === 'P') subjectName = "भारतीय राजव्यवस्था (Indian Polity)";

        const btn = document.getElementById('btn-gen');
        btn.disabled = true;
        btn.innerHTML = `<span>⏳ 20 प्रश्न तैयार हो रहे हैं...</span>`;

        const prompt = `Act as an expert competitive exam coach.
Generate a high-yield topic-wise set of 20 one-liner Q&A in Hindi for: ${subjectName}.
Part number is ${part}. Numbering must strictly be sequentially from ${startQ} to ${endQ}. No questions repeated.
Output strictly valid raw JSON with this exact structure:
{
  "capsule": "🎯 ${subjectName} (भाग ${part}) : [खंड नाम] | टॉपिक: [सटीक टॉपिक का नाम]",
  "hook": "🔥 99% अभ्यर्थी इन 20 प्रश्नों में गलतियाँ करते हैं, परीक्षा में पूरे अंक पक्के करने हैं तो अभी रट लो!",
  "questions": [
    {"q": "${startQ}. प्रश्न का टेक्स्ट?", "a": "सटीक उत्तर"},
    ... 20 items up to question ${endQ}
  ],
  "caption": "🎯 ${subjectName} (भाग ${part}) के 20 अति-महत्वपूर्ण प्रश्न जो आगामी परीक्षाओं के लिए बेहद खास हैं। पूरा पढ़ें और सुरक्षित सेव कर लें।",
  "hashtags": "#${selectedSub === 'H' ? 'HistoryGK' : selectedSub === 'G' ? 'GeographyGK' : 'PolityGK'} #CompetitiveExams #GKQuiz #ImportantGK #ExamPreparation"
}`;

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error?.message || `HTTP ${res.status}`);
            }

            const data = await res.json();
            let text = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
            const jsonMatch = text.match(/\{[\s\S]*\}/);
            if (jsonMatch) text = jsonMatch[0];

            const parsed = JSON.parse(text);

            currentData = {
                capsule: parsed.capsule,
                hook: parsed.hook,
                questions: parsed.questions
            };

            // Set Facebook caption text
            document.getElementById('fb-caption-box').innerText = `${parsed.caption}\n\n${parsed.hashtags}`;

            // Increment and save next part
            localStorage.setItem(`EP_PART_${selectedSub}`, part + 1);
            document.getElementById('current-part').value = part + 1;
            updateRangeDisplay();

            drawPoster();
            alert(`🎉 भाग ${part} के 20 प्रश्न तैयार हो गए हैं!`);
        } catch (e) {
            alert("त्रुटि: " + e.message);
            console.error(e);
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<span>✨ Generate 20 Questions Post (AI)</span>`;
        }
    }

    /* RENDER 1080 x 1350 POSTER ON CANVAS */
    function drawPoster() {
        ctx.clearRect(0, 0, 1080, 1350);

        // 1. Background
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 1080, 1350);

        // 2. Faint Watermark (45 degree tiled)
        ctx.save();
        ctx.rotate(-28 * Math.PI / 180);
        ctx.fillStyle = "rgba(15, 23, 42, 0.03)";
        ctx.font = "800 42px 'Poppins', sans-serif";
        for (let x = -600; x < 1600; x += 360) {
            for (let y = -400; y < 1800; y += 180) {
                ctx.fillText("EXAM PREPARATION", x, y);
            }
        }
        ctx.restore();

        // 3. Top Branding Header
        ctx.fillStyle = "#0284c7";
        ctx.font = "900 32px 'Poppins', sans-serif";
        ctx.fillText("EXAM Preparation", 50, 60);

        ctx.fillStyle = "#e11d48";
        ctx.font = "italic 700 24px 'Hind', sans-serif";
        ctx.fillText("• One-Shot Revision Notes", 360, 60);

        // 4. Topic Red Capsule
        roundRect(ctx, 40, 85, 1000, 56, 28, "#dc2626");
        ctx.fillStyle = "#ffffff";
        ctx.font = "800 23px 'Hind', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(currentData.capsule, 540, 122);

        // 5. Hook Black Ribbon
        roundRect(ctx, 40, 155, 1000, 48, 10, "#111827");
        ctx.fillStyle = "#facc15";
        ctx.font = "700 18.5px 'Hind', sans-serif";
        ctx.fillText(currentData.hook, 540, 186);
        ctx.textAlign = "left";

        // 6. Two Columns for 20 Questions
        // Column 1: Q1 to Q10 | Column 2: Q11 to Q20
        const col1X = 55;
        const col2X = 560;
        const startY = 250;
        const rowGap = 100;

        currentData.questions.slice(0, 10).forEach((item, i) => {
            drawQuestionBlock(col1X, startY + (i * rowGap), item, 465);
        });

        currentData.questions.slice(10, 20).forEach((item, i) => {
            drawQuestionBlock(col2X, startY + (i * rowGap), item, 465);
        });

        // 7. Footer CTA
        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(50, 1270);
        ctx.lineTo(1030, 1270);
        ctx.stroke();

        ctx.fillStyle = "#475569";
        ctx.font = "800 20px 'Hind', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("- अपने उत्तर कमेंट बॉक्स में लिखें -", 540, 1310);
        ctx.textAlign = "left";
    }

    function drawQuestionBlock(x, y, item, maxW) {
        // Question Text (Dark Bold)
        ctx.fillStyle = "#0f172a";
        ctx.font = "700 18.5px 'Hind', sans-serif";
        wrapText(ctx, item.q, x, y, maxW, 23);

        // Answer Text (Highlighted Red)
        ctx.fillStyle = "#dc2626";
        ctx.font = "800 18px 'Hind', sans-serif";
        ctx.fillText(`उत्तर: ${item.a}`, x, y + 42);
    }

    function roundRect(ctx, x, y, width, height, radius, fill) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        for(let n = 0; n < words.length; n++) {
            let testLine = line + words[n] + ' ';
            let metrics = ctx.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                ctx.fillText(line, x, y);
                line = words[n] + ' ';
                y += lineHeight;
            } else {
                line = testLine;
            }
        }
        ctx.fillText(line, x, y);
    }

    function downloadPosterImage() {
        const link = document.createElement('a');
        const part = document.getElementById('current-part').value - 1 || 1;
        link.download = `EP_20Q_${selectedSub}_Part_${part}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    function copyCaptionText() {
        const text = document.getElementById('fb-caption-box').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert("📋 फेसबुक कैप्शन और हैशटैग कॉपी हो गए हैं!");
        });
    }

    window.onload = function() {
        const k = localStorage.getItem("GEMINI_API_KEY_LOCAL");
        if (k) document.getElementById('api-key').value = k;
        selectSubject('H');
        drawPoster();
    };
</script>

</body>
</html>
